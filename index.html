<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Insegnante</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Great+Vibes&display=swap');

    :root {
      --font-ko: 'Pretendard', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    body {
      font-family: var(--font-ko);
      min-height: 100vh;
      overflow: hidden;
      color: #2d3a4a;
      /* 푸른빛·보랏빛 우주 */
      /* 인트로와 같은 어두운 우주 배경 */
      background: radial-gradient(ellipse at 50% 50%, #1b1a5e 0%, #0a0f2e 60%, #050818 100%);
      background-color: #050818;
      background-attachment: fixed;
    }

    /* ===== 공통 배경 ===== */
    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      padding: 30px 20px;
    }

    .screen.active {
      display: flex
    }

    .screen::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background:
        radial-gradient(circle at 70% 30%, rgba(150, 110, 255, .10) 0%, transparent 40%),
        radial-gradient(circle at 25% 45%, rgba(80, 150, 255, .08) 0%, transparent 45%);
      animation: bgPulse 8s ease-in-out infinite alternate;
    }

    @keyframes bgPulse {
      0% {
        transform: scale(1) rotate(0)
      }

      100% {
        transform: scale(1.1) rotate(5deg)
      }
    }

    /* ===== 시작 화면 ===== */
    .title-container {
      position: relative;
      z-index: 2;
      text-align: center;
      margin-bottom: 10px
    }

    .title {
      font-family: 'Great Vibes', cursive;
      font-size: 5.5rem;
      font-weight: 400;
      line-height: 1.1;
      background: linear-gradient(135deg, #a8bcff, #d3b4ff, #ffc2f2, #a8bcff);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradShift 4s ease-in-out infinite;
      padding: 0 10px;
    }

    @keyframes gradShift {

      0%,
      100% {
        background-position: 0% 50%
      }

      50% {
        background-position: 100% 50%
      }
    }

    .subtitle {
      font-size: 1rem;
      color: #c9d2ff;
      margin-top: 8px;
      letter-spacing: 3px
    }

    /* 시작 화면은 위에서 아래까지 꽉 차게 */
    #start-screen {
      justify-content: space-between;
      height: 100vh;
      padding: 4vh 20px 5vh;
    }

    /* 글자 빛남 효과는 부모에 적용 (그라데이션 글자에 직접 filter를 주면 글자가 사라짐) */
    .title-container {
      filter: drop-shadow(0 0 18px rgba(140, 120, 255, .55));
    }

    .silhouette-container {
      position: relative;
      z-index: 2;
      flex: 1;
      min-height: 0;
      width: 100%;
      margin: 0 0 -2vh;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }

    .silhouette-container img {
      height: 100%;
      max-height: 62vh;
      width: auto;
      max-width: 96vw;
      object-fit: contain;
      object-position: center bottom;
      position: relative;
      /* 반투명 흰 테두리·워터마크 제거: 불투명 픽셀을 모두 단색으로 */
      filter: brightness(0);
      /* 아래쪽이 버튼 쪽으로 자연스럽게 사라지도록 */
      -webkit-mask-image: linear-gradient(to bottom, #000 72%, transparent 100%);
      mask-image: linear-gradient(to bottom, #000 72%, transparent 100%);
    }

    /* 사람들 뒤에서 퍼지는 성운 빛 */
    .glow-ring {
      position: absolute;
      left: 50%;
      bottom: 8%;
      transform: translateX(-50%);
      width: min(820px, 110vw);
      height: min(560px, 70vh);
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(130, 150, 255, .75) 0%, rgba(150, 100, 255, .35) 40%, rgba(150, 100, 255, 0) 70%);
      filter: blur(6px);
    }

    .glow-ring:nth-child(2) {
      width: min(1100px, 140vw);
      height: min(760px, 90vh);
      background: radial-gradient(ellipse, rgba(200, 120, 255, .30) 0%, rgba(90, 140, 255, .15) 45%, rgba(90, 140, 255, 0) 70%)
    }

    /* ===== 인트로 ===== */
    #intro {
      position: fixed;
      inset: 0;
      z-index: 100;
      /* 시작 화면 남색 배너와 같은 색 → 인트로가 끝나면 자연스럽게 이어짐 */
      background:
        radial-gradient(ellipse at 50% 45%, rgba(120, 160, 255, .28) 0%, rgba(120, 160, 255, 0) 55%),
        linear-gradient(180deg, #0c1c55 0%, #16307f 55%, #1f3fae 100%);
      transition: opacity 1s ease;
    }

    #intro canvas {
      display: block;
      width: 100%;
      height: 100%
    }

    #intro.hide {
      opacity: 0;
      pointer-events: none
    }

    .skip-btn {
      position: absolute;
      right: 20px;
      bottom: 20px;
      padding: 8px 18px;
      font-family: var(--font-ko);
      font-size: .85rem;
      font-weight: 700;
      color: #fff;
      background: rgba(255, 255, 255, .06);
      border: 1px solid rgba(255, 255, 255, .55);
      border-radius: 6px;
      cursor: pointer;
    }

    .skip-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, .16)
    }

    /* 인트로가 끝나기 전에는 시작 화면 제목을 숨겨 둠 (별이 모여 제목이 됨) */
    body.intro-on .title-container,
    body.intro-on .subtitle {
      opacity: 0
    }

    .title-container {
      transition: opacity .8s ease
    }

    .start-btn {
      position: relative;
      z-index: 2;
      padding: 18px 60px;
      font-size: 1.3rem;
      font-weight: 700;
      font-family: var(--font-ko);
      color: #fff;
      background: linear-gradient(135deg, #5b7cff, #a86bff);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all .3s;
      box-shadow: 0 8px 25px rgba(91, 124, 255, .35);
      letter-spacing: 2px;
    }

    .start-btn:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 12px 35px rgba(91, 124, 255, .5)
    }

    .start-btn:active {
      transform: translateY(0) scale(.98)
    }

    /* ===== 시작 화면: 내 선생님 ===== */
    .start-row{position:relative;z-index:2;display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
    .start-btn.fav-btn{background:#fff;color:#6a4fd8;border:2px solid #a99bff;box-shadow:0 8px 25px rgba(91,124,255,.15)}
    .fav-bar{position:relative;z-index:2;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px;max-width:600px}
    .fav-chip{
      padding:6px 14px;font-size:.85rem;font-family:var(--font-ko);font-weight:700;color:#2d3a4a;
      background:rgba(255,255,255,.85);border:1px solid rgba(91,124,255,.25);border-radius:20px;cursor:pointer;
    }
    .fav-chip:hover{background:#f3f1ff}

    /* ===== 카드 버튼 ===== */
    .card-actions{display:flex;gap:8px;flex-wrap:wrap}
    .review-btn{color:#3a7bd5;background:#eef5ff;border-color:#b9d4ff}
    .review-btn:hover{background:#dde9ff}

    /* ===== 후기 / 폼 ===== */
    .review-guide{font-size:.88rem;color:#5b6878;line-height:1.55;margin:12px 0;padding:10px 14px;background:#f4f9ff;border-radius:10px}
    .notice-box{font-size:.88rem;color:#8a5a00;background:#fff4d1;border-radius:10px;padding:12px 14px;margin:12px 0;line-height:1.55}
    .review-avg{font-size:1.05rem;color:#2d3a4a;margin:10px 0}
    .stars{color:#ffb21e;letter-spacing:1px}
    .muted{color:#8a97a8;font-weight:400}
    .small{font-size:.8rem}
    .review-list{display:flex;flex-direction:column;gap:10px;margin-top:10px}
    .review-item{border:1px solid rgba(45,58,74,.08);border-radius:12px;padding:14px}
    .review-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
    .verified{font-size:.75rem;font-weight:800;color:#2e8b4f;background:#e3f6e8;padding:2px 10px;border-radius:10px}
    .review-course{font-size:.82rem;color:#6a4fd8;margin-top:6px}
    .review-text{font-size:.92rem;color:#2d3a4a;line-height:1.55;margin-top:6px;white-space:pre-wrap}
    .review-meta{font-size:.75rem;color:#8a97a8;margin-top:8px}
    .modal-actions{display:flex;flex-direction:column;gap:8px;margin-top:20px}
    .as-btn{border:none;cursor:pointer;width:100%;font-family:var(--font-ko);font-size:1rem;margin-top:0}
    .as-btn:disabled{opacity:.6;cursor:default}
    .ghost-btn{
      width:100%;padding:12px;border-radius:50px;font-family:var(--font-ko);font-weight:700;font-size:.92rem;
      color:#5b6878;background:#fff;border:1px solid rgba(45,58,74,.15);cursor:pointer;
    }
    .ghost-btn:hover{background:#f4f7fb}
    .form{display:flex;flex-direction:column;gap:14px;margin-top:10px}
    .form label{display:flex;flex-direction:column;gap:6px;font-size:.9rem;font-weight:800;color:#2d3a4a}
    .form input[type=text],.form input[type=number],.form input[type=url],.form select,.form textarea{
      font-family:var(--font-ko);font-size:.95rem;padding:10px 12px;border-radius:10px;
      border:1px solid rgba(45,58,74,.18);background:#fff;color:#2d3a4a;font-weight:400;
    }
    .form textarea{resize:vertical}
    .form input:focus,.form select:focus,.form textarea:focus{outline:none;border-color:#5b7cff}
    .form label.check{flex-direction:row;align-items:flex-start;gap:8px;font-weight:400;font-size:.85rem;color:#5b6878}
    .field-msg{font-size:.8rem;font-weight:700;min-height:1em}
    .field-msg.error{color:#d4542b}
    .field-msg.ok{color:#2e8b4f}
    .proof-preview{max-width:100%;max-height:200px;border-radius:10px;border:1px solid rgba(45,58,74,.1);object-fit:contain}
    .star-input{display:flex;gap:4px}
    .star-input button{font-size:1.7rem;background:none;border:none;color:#d6dbe2;cursor:pointer;padding:0 2px}
    .star-input button.on{color:#ffb21e}

    /* ===== 내 선생님 모달 ===== */
    .my-item,.pick-item{
      display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
      padding:10px 12px;border:1px solid rgba(45,58,74,.08);border-radius:12px;margin-bottom:8px;
    }
    .my-item{background:#f6f5ff}
    .my-actions{display:flex;gap:6px}
    .mini-btn{
      padding:6px 12px;font-size:.8rem;font-weight:700;font-family:var(--font-ko);
      color:#5b6878;background:#fff;border:1px solid rgba(45,58,74,.15);border-radius:16px;cursor:pointer;
    }
    .mini-btn:hover{border-color:#a99bff}
    .mini-btn.on,.mini-btn.accent{background:linear-gradient(135deg,#5b7cff,#a86bff);color:#fff;border-color:transparent}
    .kind-badge{font-size:.72rem;padding:2px 8px;border-radius:10px;background:#eef5ff;color:#3a7bd5;margin-left:4px}
    .kind-badge.love{background:#ffe8f0;color:#d63d76}
    .platform-group{margin-top:14px}
    .platform-title{
      font-size:.88rem;font-weight:800;color:#6a4fd8;margin-bottom:8px;padding:6px 12px;
      background:#f3f1ff;border-radius:10px;display:flex;justify-content:space-between;align-items:center;
    }

    /* ===== 시작 화면 왼쪽 위: 내 선생님 패널 ===== */
    .my-panel{
      position:absolute;top:18px;left:18px;z-index:5;max-width:300px;max-height:calc(100vh - 36px);overflow-y:auto;
      display:flex;flex-direction:column;gap:12px;
    }
    .my-panel:empty{display:none}
    .mp-group{
      background:rgba(15,20,60,.45);backdrop-filter:blur(10px);
      border:1px solid rgba(170,180,255,.25);border-radius:16px;padding:10px 12px;
    }
    .mp-subject{font-size:.78rem;font-weight:800;color:#c9d2ff;letter-spacing:2px;margin-bottom:8px}
    .mp-row{display:flex;flex-wrap:wrap;gap:12px}
    .mp-t{display:flex;flex-direction:column;align-items:center;width:68px;cursor:pointer;background:none;border:none;font-family:var(--font-ko)}
    .avatar-ring{
      --p:0;position:relative;width:60px;height:60px;border-radius:50%;padding:3px;
      background:conic-gradient(#7ee3a5 calc(var(--p)*1%), rgba(255,255,255,.18) 0);
    }
    .avatar-ring.pending{background:conic-gradient(#ffd56b calc(var(--p)*1%), rgba(255,255,255,.18) 0)}
    .avatar{
      width:100%;height:100%;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;
      background:linear-gradient(135deg,#5b7cff,#a86bff);color:#fff;font-weight:800;font-size:1.25rem;
      border:2px solid #141a4a;
    }
    .avatar img{width:100%;height:100%;object-fit:cover}
    .pct-badge{
      position:absolute;right:-8px;bottom:-4px;font-size:.66rem;font-weight:800;padding:2px 6px;border-radius:10px;
      background:#7ee3a5;color:#123;box-shadow:0 2px 6px rgba(0,0,0,.3);white-space:nowrap;
    }
    .pct-badge.pending{background:#ffd56b}
    .pct-badge.none{background:rgba(255,255,255,.85);color:#5b6878}
    .love-mark{position:absolute;left:-4px;top:-4px;font-size:.9rem}
    .mp-name{margin-top:6px;font-size:.78rem;font-weight:800;color:#fff;text-align:center;line-height:1.2;word-break:keep-all}
    .mp-sub{font-size:.66rem;color:#aab5ef;text-align:center}
    .photo-btn{font-size:.72rem;padding:4px 10px}
    .my-item .avatar-ring{width:46px;height:46px;flex-shrink:0}
    .my-item .avatar{font-size:1rem;border-color:#fff}
    .my-left{display:flex;align-items:center;gap:10px}
    @media(max-width:700px){
      .my-panel{position:relative;top:auto;left:auto;max-width:100%;width:100%;flex-direction:row;overflow-x:auto;max-height:none;margin-bottom:6px}
      .mp-group{flex-shrink:0}
      .avatar-ring{width:48px;height:48px}
      .mp-t{width:56px}
    }

    /* ===== 질문 화면 ===== */
    #question-screen {
      overflow-y: auto
    }

    .question-card {
      background: rgba(255, 255, 255, .95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, .9);
      border-radius: 24px;
      box-shadow: 0 10px 40px rgba(91, 124, 255, .15);
      padding: 40px 35px;
      max-width: 620px;
      width: 100%;
      text-align: center;
      position: relative;
      z-index: 2;
      animation: slideUp .5s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(40px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .progress-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 25px;
    }

    .progress-bar {
      flex: 1;
      height: 6px;
      background: rgba(45, 58, 74, .08);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #5b7cff, #a86bff);
      border-radius: 3px;
      transition: width .5s ease;
    }

    .progress-text {
      font-size: .75rem;
      color: #8a97a8;
      white-space: nowrap;
      min-width: 42px;
      text-align: right;
    }

    .back-btn {
      position: relative;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 18px;
      padding: 6px 16px;
      font-size: .85rem;
      font-family: var(--font-ko);
      color: #6b7a8c;
      background: rgba(255, 255, 255, .7);
      border: 1px solid rgba(45, 58, 74, .1);
      border-radius: 20px;
      cursor: pointer;
      transition: all .3s;
    }

    .back-btn:hover {
      color: #2d3a4a;
      background: #fff
    }

    .back-btn.hidden {
      visibility: hidden;
      pointer-events: none
    }

    .question-number {
      font-size: .85rem;
      color: #5b7cff;
      margin-bottom: 8px;
      letter-spacing: 2px;
      font-weight: 700
    }

    /* 질문이 바뀔 때: 책장 넘기듯 옆으로 천천히 */
    .question-card { overflow: hidden }
    .q-body.busy { pointer-events: none }
    .q-out-next { animation: qOutLeft .2s ease-in forwards }
    .q-in-next  { animation: qInRight .3s cubic-bezier(.22, .8, .3, 1) both }
    .q-out-prev { animation: qOutRight .2s ease-in forwards }
    .q-in-prev  { animation: qInLeft .3s cubic-bezier(.22, .8, .3, 1) both }

    @keyframes qOutLeft  { to   { opacity: 0; transform: translateX(-60px) } }
    @keyframes qOutRight { to   { opacity: 0; transform: translateX(60px) } }
    @keyframes qInRight  { from { opacity: 0; transform: translateX(60px) } to { opacity: 1; transform: none } }
    @keyframes qInLeft   { from { opacity: 0; transform: translateX(-60px) } to { opacity: 1; transform: none } }

    .question-stage {
      display: inline-block;
      font-size: .75rem;
      font-weight: 800;
      color: #6a4fd8;
      background: #f3f1ff;
      padding: 3px 12px;
      border-radius: 12px;
      margin-bottom: 8px
    }

    .question-text {
      font-size: 1.45rem;
      font-weight: 800;
      color: #2d3a4a;
      margin-bottom: 8px;
      line-height: 1.6
    }

    .question-hint {
      font-size: .85rem;
      color: #8a97a8;
      margin-bottom: 22px
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px
    }

    .option-btn {
      padding: 15px 22px;
      font-size: 1rem;
      font-family: var(--font-ko);
      color: #2d3a4a;
      background: #fff;
      border: 1px solid rgba(45, 58, 74, .12);
      border-radius: 14px;
      cursor: pointer;
      transition: background-color .2s ease, border-color .2s ease;
      text-align: left;
    }

    .option-btn:hover {
      background: #f3f1ff;
      border-color: #a99bff;
    }

    .option-btn.selected {
      background: linear-gradient(135deg, #e4e0ff, #efe0ff);
      border-color: #5b7cff;
      color: #2d3a4a;
    }

    /* 옵션 그리드 (세부과목 등 많을 때) */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .options-grid .option-btn {
      text-align: center;
      padding: 14px 12px;
      font-size: .95rem
    }

    /* ===== 분석 중 화면 ===== */
    #loading-screen {
      justify-content: center;
      gap: 25px
    }

    .loading-text {
      position: relative;
      z-index: 2;
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
      text-align: center;
    }

    .loading-sub {
      position: relative;
      z-index: 2;
      font-size: 1rem;
      color: #c9d2ff;
      text-align: center;
    }

    .spinner {
      position: relative;
      z-index: 2;
      width: 80px;
      height: 80px;
    }

    .spinner::before,
    .spinner::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      animation: spinPulse 1.5s ease-in-out infinite;
    }

    .spinner::before {
      inset: 0;
      border: 3px solid transparent;
      border-top-color: #a86bff;
      border-right-color: #5b7cff;
      animation: spin 1s linear infinite;
    }

    .spinner::after {
      inset: 10px;
      border: 3px solid transparent;
      border-bottom-color: #7877c6;
      border-left-color: #4cafff;
      animation: spin 1.5s linear infinite reverse;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .loading-steps {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 320px;
      width: 100%;
    }

    .loading-step {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: .9rem;
      color: rgba(201, 210, 255, .45);
      transition: all .5s;
    }

    .loading-step.active {
      color: #fff
    }

    .loading-step.done {
      color: #7ee3a5
    }

    .step-icon {
      font-size: 1.1rem;
      width: 24px;
      text-align: center
    }

    /* ===== 결과 화면 ===== */
    #result-screen {
      justify-content: flex-start;
      overflow-y: auto;
      padding-top: 40px;
      padding-bottom: 60px
    }

    .result-card {
      background: rgba(255, 255, 255, .95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, .9);
      border-radius: 24px;
      box-shadow: 0 10px 40px rgba(91, 124, 255, .15);
      padding: 45px 35px;
      max-width: 680px;
      width: 100%;
      text-align: center;
      position: relative;
      z-index: 2;
      animation: slideUp .6s ease-out;
    }

    .result-title {
      font-size: 1.8rem;
      font-weight: 900;
      color: #2d3a4a;
      margin-bottom: 8px
    }

    .result-subtitle {
      font-size: 1rem;
      color: #6b7a8c;
      margin-bottom: 25px
    }

    /* 답변 요약 */
    .summary-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 20px;
      font-size: .85rem;
      font-family: var(--font-ko);
      color: #6b7a8c;
      background: #fff;
      border: 1px solid rgba(45, 58, 74, .1);
      border-radius: 20px;
      cursor: pointer;
      transition: all .3s;
      margin-bottom: 20px;
    }

    .summary-toggle:hover {
      color: #2d3a4a;
      background: #f3f1ff
    }

    .summary-panel {
      display: none;
      background: #f6f5ff;
      border: 1px solid rgba(91, 124, 255, .15);
      border-radius: 14px;
      padding: 18px 22px;
      margin-bottom: 22px;
      text-align: left;
    }

    .summary-panel.open {
      display: block;
      animation: slideUp .3s ease-out
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 0;
      border-bottom: 1px solid rgba(45, 58, 74, .06);
      font-size: .85rem;
    }

    .summary-row:last-child {
      border-bottom: none
    }

    .summary-label {
      color: #8a97a8
    }

    .summary-value {
      color: #2d3a4a;
      font-weight: 700
    }

    .match-score {
      display: inline-block;
      padding: 3px 12px;
      border-radius: 12px;
      font-size: .8rem;
      font-weight: 700;
      margin-left: 8px;
    }

    .match-high {
      background: #e3f6e8;
      color: #2e8b4f
    }

    .match-medium {
      background: #fff4d1;
      color: #b7860b
    }

    .match-low {
      background: #ffe6dd;
      color: #d4542b
    }

    .teacher-recommendation {
      background: #fff;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 14px;
      border: 1px solid rgba(45, 58, 74, .08);
      text-align: left;
      transition: all .3s;
      box-shadow: 0 4px 14px rgba(45, 58, 74, .05);
    }

    .teacher-recommendation:hover {
      background: #f6f5ff;
      transform: translateY(-2px)
    }

    .teacher-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 6px;
    }

    .teacher-name {
      font-size: 1.2rem;
      font-weight: 700;
      color: #2d3a4a
    }

    .teacher-platform {
      font-size: .85rem;
      color: #6a4fd8;
      margin-bottom: 6px
    }

    .teacher-desc {
      font-size: .9rem;
      color: #5b6878;
      line-height: 1.5;
      margin-bottom: 8px
    }

    .teacher-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px
    }

    .tag {
      padding: 3px 10px;
      font-size: .75rem;
      border-radius: 10px;
      background: #f4f7fb;
      border: 1px solid rgba(45, 58, 74, .08);
      color: #5b6878;
    }

    .btn-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 25px;
      flex-wrap: wrap
    }

    .restart-btn,
    .share-btn {
      padding: 14px 36px;
      font-size: 1rem;
      font-weight: 700;
      font-family: var(--font-ko);
      color: #fff;
      border-radius: 50px;
      cursor: pointer;
      transition: all .3s ease;
    }

    .restart-btn {
      background: linear-gradient(135deg, #5b7cff, #a86bff);
      border: none;
      box-shadow: 0 6px 18px rgba(91, 124, 255, .3);
    }

    .restart-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(91, 124, 255, .45)
    }

    .share-btn {
      background: #fff;
      color: #6a4fd8;
      border: 2px solid #a99bff;
    }

    .share-btn:hover {
      transform: translateY(-2px);
      background: #f3f1ff;
      box-shadow: 0 8px 20px rgba(91, 124, 255, .2)
    }

    /* ===== 전체 선생님 화면 ===== */
    #all-screen {
      justify-content: flex-start;
      overflow-y: auto;
      padding-top: 40px;
      padding-bottom: 60px
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 12px
    }

    .chip {
      padding: 7px 16px;
      font-size: .9rem;
      font-family: var(--font-ko);
      font-weight: 700;
      color: #5b6878;
      background: #fff;
      border: 1px solid rgba(45, 58, 74, .12);
      border-radius: 20px;
      cursor: pointer;
      transition: all .2s;
    }

    .chip:hover {
      border-color: #a99bff
    }

    .chip.on {
      background: linear-gradient(135deg, #5b7cff, #a86bff);
      color: #fff;
      border-color: transparent
    }

    .filter-row.small .chip {
      font-size: .8rem;
      padding: 5px 12px
    }

    .all-count {
      font-size: .85rem;
      color: #8a97a8;
      margin: 6px 0 16px
    }

    .group-title {
      text-align: left;
      font-size: 1rem;
      font-weight: 800;
      color: #6a4fd8;
      margin: 22px 0 10px;
      padding-left: 4px;
    }

    .group-title:first-child {
      margin-top: 4px
    }

    /* ===== 강사 상세 보기 ===== */
    .detail-btn{
      margin-top:12px;padding:8px 18px;font-size:.85rem;font-weight:700;
      font-family:var(--font-ko);color:#6a4fd8;background:#f3f1ff;
      border:1px solid #cfc6ff;border-radius:20px;cursor:pointer;transition:all .2s;
    }
    .detail-btn:hover{background:#e6e1ff}
    .modal-bg{
      position:fixed;inset:0;z-index:50;display:none;
      background:rgba(45,58,74,.35);backdrop-filter:blur(4px);
      align-items:center;justify-content:center;padding:20px;
    }
    .modal-bg.open{display:flex}
    .modal{
      background:#fff;border-radius:22px;max-width:560px;width:100%;
      max-height:88vh;overflow-y:auto;padding:32px 28px;position:relative;
      box-shadow:0 20px 60px rgba(45,58,74,.25);text-align:left;
      animation:slideUp .3s ease-out;
    }
    .modal-close{
      position:absolute;top:14px;right:16px;width:36px;height:36px;border-radius:50%;
      border:none;background:#f4f7fb;color:#5b6878;font-size:1.1rem;cursor:pointer;
    }
    .modal-close:hover{background:#e6e1ff;color:#6a4fd8}
    .modal h3{font-size:1.5rem;font-weight:800;color:#2d3a4a;margin-bottom:4px;padding-right:40px}
    .modal-section{margin-top:22px}
    .modal-section h4{font-size:1rem;font-weight:800;color:#6a4fd8;margin-bottom:10px}
    .feature-list{list-style:none;display:flex;flex-direction:column;gap:6px}
    .feature-list li{
      font-size:.92rem;color:#2d3a4a;padding:9px 14px;background:#f6f5ff;
      border-radius:10px;border-left:3px solid #a99bff;
    }
    .course-list{display:flex;flex-direction:column;gap:8px;counter-reset:c}
    .course-item{
      padding:12px 14px 12px 46px;border:1px solid rgba(45,58,74,.08);border-radius:12px;
      position:relative;counter-increment:c;
    }
    .course-item::before{
      content:counter(c);position:absolute;left:12px;top:12px;width:24px;height:24px;
      border-radius:50%;background:linear-gradient(135deg,#5b7cff,#a86bff);
      color:#fff;font-size:.8rem;font-weight:800;display:flex;align-items:center;justify-content:center;
    }
    .course-title{font-weight:800;color:#2d3a4a;font-size:.95rem}
    .course-desc{font-size:.85rem;color:#5b6878;margin-top:3px;line-height:1.45}
    .empty-note{font-size:.85rem;color:#8a97a8}
    .link-btn{
      display:block;text-align:center;margin-top:24px;padding:14px;border-radius:50px;
      font-weight:800;color:#fff;text-decoration:none;
      background:linear-gradient(135deg,#5b7cff,#a86bff);box-shadow:0 6px 18px rgba(91,124,255,.3);
    }
    .link-btn:hover{box-shadow:0 10px 24px rgba(91,124,255,.45)}
    .link-note{font-size:.75rem;color:#8a97a8;text-align:center;margin-top:8px}
    .site-btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
    .site-btns .link-btn{margin-top:0}
    .link-btn.alt{background:#fff;color:#6a4fd8;border:2px solid #a99bff;box-shadow:none}

    /* 파티클 */
    .particle {
      position: fixed;
      width: 4px;
      height: 4px;
      background: rgba(220, 230, 255, .8);box-shadow: 0 0 6px rgba(170, 190, 255, .9);
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
      animation: particleFloat linear infinite;
    }

    @keyframes particleFloat {
      0% {
        transform: translateY(100vh) rotate(0);
        opacity: 0
      }

      10% {
        opacity: 1
      }

      90% {
        opacity: 1
      }

      100% {
        transform: translateY(-100vh) rotate(720deg);
        opacity: 0
      }
    }

    .fade-out {
      animation: fadeOut .4s ease-out forwards
    }

    .fade-in {
      animation: fadeIn .4s ease-in forwards
    }

    @keyframes fadeOut {
      to {
        opacity: 0;
        transform: scale(.95)
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(1.05)
      }

      to {
        opacity: 1;
        transform: scale(1)
      }
    }

    @media(max-width:500px) {
      .title {
        font-size: 3.8rem
      }

      .silhouette-container img {
        max-height: 55vh
      }

      .question-card,
      .result-card {
        padding: 25px 18px
      }

      .question-text {
        font-size: 1.15rem
      }

      .options-grid {
        grid-template-columns: 1fr
      }
    }

    /* =====================================================================
       강의 사이트(메가스터디·이투스·대성마이맥) 스타일 — 인트로 제외 전체 적용
       흰 배경 · 상단 메뉴바 · 고딕체 · 남색/파랑 포인트 · 얇은 테두리 카드
       ===================================================================== */
    :root {
      --c-main: #2453d4;      /* 포인트 파랑 */
      --c-main-dark: #16307f; /* 남색 */
      --c-main-soft: #eef3ff;
      --c-line: #e1e5ec;
      --c-text: #1f2633;
      --c-sub: #5f6b7c;
      --c-muted: #8b95a5;
      --c-bg: #f3f5f8;
      --gnb-h: 60px;
    }

    body {
      background: var(--c-bg) !important;
      color: var(--c-text);
      font-family: var(--font-ko);
      letter-spacing: -0.2px;
    }

    .particle, .screen::before { display: none !important; }

    /* 상단 메뉴바 */
    .gnb {
      position: fixed; top: 0; left: 0; right: 0; z-index: 40; height: var(--gnb-h);
      background: #fff; border-bottom: 1px solid var(--c-line);
    }
    .gnb-inner {
      max-width: 1100px; height: 100%; margin: 0 auto; padding: 0 20px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .gnb-logo {
      font-family: 'Great Vibes', cursive; font-size: 2rem; color: var(--c-main-dark);
      background: none; border: none; cursor: pointer; line-height: 1;
    }
    .gnb-menu { display: flex; gap: 4px; }
    .gnb-menu button {
      font-family: var(--font-ko); font-size: .95rem; font-weight: 700; color: var(--c-text);
      background: none; border: none; padding: 8px 14px; cursor: pointer; border-radius: 6px;
    }
    .gnb-menu button:hover { color: var(--c-main); background: var(--c-main-soft); }

    .screen,
    #result-screen,
    #all-screen,
    #question-screen,
    #loading-screen { padding-top: calc(var(--gnb-h) + 30px); }

    /* ---------- 시작 화면: 남색 메인 배너 ---------- */
    #start-screen {
      height: 100vh; padding-top: calc(var(--gnb-h) + 4vh);
      background: linear-gradient(180deg, #102466 0%, #1f3fae 60%, #2f5be6 100%);
    }
    .title-container { filter: none; }
    .title {
      background: none; -webkit-text-fill-color: #fff; color: #fff; animation: none;
    }
    .subtitle { color: rgba(255, 255, 255, .85); font-weight: 500; letter-spacing: 1px; }
    .glow-ring { background: radial-gradient(ellipse, rgba(170, 195, 255, .55) 0%, rgba(120, 160, 255, .2) 45%, rgba(120, 160, 255, 0) 70%); filter: none; }
    .glow-ring:nth-child(2) { background: radial-gradient(ellipse, rgba(255, 255, 255, .12) 0%, rgba(255, 255, 255, 0) 70%); }
    .start-btn {
      background: #fff; color: var(--c-main-dark); border-radius: 8px; box-shadow: none;
      font-weight: 800; letter-spacing: 0; padding: 16px 48px;
    }
    .start-btn:hover { transform: none; box-shadow: none; background: #f0f4ff; }
    .start-btn.fav-btn { background: transparent; color: #fff; border: 1.5px solid rgba(255, 255, 255, .8); }
    .start-btn.fav-btn:hover { background: rgba(255, 255, 255, .12); }
    .my-panel { top: calc(var(--gnb-h) + 16px); }
    .mp-group { background: #fff; border: 1px solid var(--c-line); border-radius: 10px; backdrop-filter: none; }
    .mp-subject { color: var(--c-main-dark); letter-spacing: 0; font-size: .82rem; }
    .mp-name { color: var(--c-text); }
    .mp-sub { color: var(--c-muted); }
    .avatar { background: var(--c-main); border-color: #fff; }

    /* ---------- 공통 카드 ---------- */
    .question-card, .result-card {
      background: #fff; border: 1px solid var(--c-line); border-radius: 12px;
      box-shadow: 0 2px 10px rgba(20, 35, 80, .05); backdrop-filter: none;
    }
    .question-card { border-top: 4px solid var(--c-main); }
    .result-title { font-weight: 800; color: var(--c-text); font-size: 1.6rem; }
    .result-subtitle { color: var(--c-sub); }

    /* 질문 칸 */
    .progress-bar { height: 4px; background: #e8ecf3; border-radius: 2px; }
    .progress-fill { background: var(--c-main); }
    .progress-text { color: var(--c-main); font-weight: 700; }
    .question-stage { background: var(--c-main-soft); color: var(--c-main); border-radius: 4px; }
    .question-number { color: var(--c-muted); font-weight: 600; letter-spacing: 0; }
    .question-text { color: var(--c-text); font-weight: 800; letter-spacing: -0.5px; }
    .question-hint { color: var(--c-muted); }
    .back-btn {
      background: #fff; border: 1px solid var(--c-line); color: var(--c-sub); border-radius: 6px;
    }
    .back-btn:hover { color: var(--c-main); border-color: var(--c-main); background: #fff; }
    .option-btn {
      background: #fff; border: 1px solid var(--c-line); border-radius: 8px; color: var(--c-text);
      font-weight: 500; padding: 15px 44px 15px 18px; position: relative;
    }
    .options-grid .option-btn { padding: 14px 12px; }
    .option-btn:hover { background: #f7f9ff; border-color: var(--c-main); }
    .option-btn.selected {
      background: var(--c-main-soft); border-color: var(--c-main); color: var(--c-main); font-weight: 700;
    }
    .option-btn.selected::after {
      content: '✓'; position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
      font-weight: 900; color: var(--c-main);
    }

    /* 분석 중 화면 */
    .loading-text { color: var(--c-text); }
    .loading-sub { color: var(--c-sub); }
    .loading-step { color: #b6bfcc; }
    .loading-step.active { color: var(--c-text); }
    .loading-step.done { color: var(--c-main); }
    .spinner::before { border-top-color: var(--c-main); border-right-color: var(--c-main); }
    .spinner::after { border-bottom-color: #9db4f5; border-left-color: #9db4f5; }

    /* 결과 · 전체 선생님 카드 */
    .teacher-recommendation {
      background: #fff; border: 1px solid var(--c-line); border-radius: 10px; box-shadow: none;
    }
    .teacher-recommendation:hover { background: #fff; border-color: #b9c8ee; transform: none; }
    .teacher-name { color: var(--c-text); font-weight: 800; }
    .teacher-platform { color: var(--c-main); font-weight: 600; }
    .teacher-desc { color: var(--c-sub); }
    .tag { background: #f3f5f8; border: none; color: var(--c-sub); border-radius: 4px; }
    .match-score { border-radius: 4px; }
    .detail-btn {
      background: #fff; color: var(--c-main); border: 1px solid var(--c-main); border-radius: 6px;
    }
    .detail-btn:hover { background: var(--c-main-soft); }
    .review-btn { color: var(--c-sub); border-color: var(--c-line); }
    .review-btn:hover { background: #f3f5f8; }
    .summary-toggle { background: #fff; border: 1px solid var(--c-line); color: var(--c-sub); border-radius: 6px; }
    .summary-panel { background: #f8f9fb; border: 1px solid var(--c-line); border-radius: 8px; }
    .group-title { color: var(--c-main-dark); border-bottom: 2px solid var(--c-main-dark); padding-bottom: 6px; }

    .restart-btn {
      background: var(--c-main); border: none; border-radius: 8px; box-shadow: none;
    }
    .restart-btn:hover { background: var(--c-main-dark); box-shadow: none; }
    .share-btn {
      background: #fff; color: var(--c-main); border: 1px solid var(--c-main); border-radius: 8px;
    }
    .share-btn:hover { background: var(--c-main-soft); box-shadow: none; }

    /* 과목 탭 · 플랫폼 필터 */
    #subject-filter { gap: 0; border-bottom: 1px solid var(--c-line); margin-bottom: 14px; }
    #subject-filter .chip {
      background: none; border: none; border-bottom: 3px solid transparent; border-radius: 0;
      color: var(--c-sub); padding: 10px 18px; font-size: .95rem;
    }
    #subject-filter .chip.on { color: var(--c-text); border-bottom-color: var(--c-text); background: none; }
    .chip { border-radius: 6px; border-color: var(--c-line); }
    .chip:hover { border-color: var(--c-main); }
    .chip.on { background: var(--c-main); color: #fff; border-color: var(--c-main); }

    /* 팝업 */
    .modal-bg { background: rgba(15, 25, 50, .45); backdrop-filter: none; }
    .modal { border-radius: 12px; box-shadow: 0 10px 40px rgba(15, 25, 50, .2); }
    .modal h3 { font-weight: 800; }
    .modal-section h4 { color: var(--c-main-dark); border-left: 3px solid var(--c-main); padding-left: 8px; }
    .feature-list li { background: #f8f9fb; border-left-color: var(--c-main); border-radius: 4px; }
    .course-item { border-color: var(--c-line); border-radius: 8px; }
    .course-item::before { background: var(--c-main); border-radius: 4px; }
    .link-btn { background: var(--c-main); border-radius: 8px; box-shadow: none; }
    .link-btn:hover { background: var(--c-main-dark); box-shadow: none; }
    .link-btn.alt { background: #fff; color: var(--c-main); border: 1px solid var(--c-main); }
    .link-btn.alt:hover { background: var(--c-main-soft); }
    .mini-btn { border-radius: 6px; }
    .mini-btn.on, .mini-btn.accent { background: var(--c-main); }
    .platform-title { background: #f3f5f8; color: var(--c-main-dark); border-radius: 6px; }
    .kind-badge { border-radius: 4px; }
    .review-guide { background: #f3f6fd; border-radius: 6px; }

    /* 로그인 · 관리자 */
    .gnb-inner { gap: 10px; }
    .gnb-menu { flex-wrap: wrap; justify-content: flex-end; }
    .gnb-auth { flex-shrink: 0; display: flex; gap: 6px; }
    a.mini-btn { text-decoration: none; display: inline-block; }
    .gnb-login, .gnb-user {
      font-family: var(--font-ko); font-size: .9rem; font-weight: 800; cursor: pointer;
      padding: 8px 14px; border-radius: 6px; white-space: nowrap;
    }
    .gnb-login { background: var(--c-main); color: #fff; border: none; }
    .gnb-login:hover { background: var(--c-main-dark); }
    .gnb-user { background: #fff; color: var(--c-text); border: 1px solid var(--c-line); }
    .gnb-user:hover { border-color: var(--c-main); color: var(--c-main); }
    .gnb-menu button.gnb-admin { color: #c4421b; }
    .admin-badge { font-size: .7rem; background: #ffe6dd; color: #c4421b; border-radius: 4px; padding: 1px 6px; margin-right: 6px; }
    .auth-tabs { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--c-line); margin: 6px 0 4px; }
    .auth-tabs button {
      font-family: var(--font-ko); font-size: .95rem; font-weight: 800; padding: 10px; cursor: pointer;
      background: none; border: none; border-bottom: 3px solid transparent; color: var(--c-muted);
    }
    .auth-tabs button.on { color: var(--c-text); border-bottom-color: var(--c-main); }
    .form input[type=email], .form input[type=password] {
      font-family: var(--font-ko); font-size: .95rem; padding: 10px 12px; border-radius: 10px;

    .mini-btn.danger { color: #c4421b; border-color: #f2c2b3; }
    .mini-btn.danger:hover { background: #fff2ee; border-color: #c4421b; }
    #admin-screen { justify-content: flex-start; overflow-y: auto; padding-bottom: 60px; }
    .admin-card { max-width: 960px; }
    .admin-item { border: 1px solid var(--c-line); border-radius: 10px; padding: 14px; margin-bottom: 10px; text-align: left; background: #fff; }
    .admin-row { display: grid; grid-template-columns: 1fr 260px; gap: 16px; }
    .admin-row-compact { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .admin-proof img { margin-top: 6px; cursor: zoom-in; display: none; }
    .admin-toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .admin-toolbar input { flex: 1; min-width: 200px; font-family: var(--font-ko); font-size: .95rem; padding: 9px 12px; border: 1px solid var(--c-line); border-radius: 8px; }
    @media (max-width: 760px) {
      .admin-row { grid-template-columns: 1fr; }
      .gnb { height: auto; min-height: var(--gnb-h); }

    /* 정보 제보 */
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .report-link { background: none; border: none; color: var(--c-main); font-family: var(--font-ko); font-weight: 700; font-size: .88rem; cursor: pointer; padding: 6px 4px; }
    .report-link:hover { text-decoration: underline; }
    .report-hint { text-align: center; font-size: .85rem; color: var(--c-sub); margin-top: 18px; }

    /* 내가 쓴 후기 상태 */
    .rv-status { font-size: .75rem; font-weight: 800; padding: 2px 10px; border-radius: 4px; }
    .rv-status.pending { background: #fff4d1; color: #8a6400; }
    .rv-status.approved { background: #e3f6e8; color: #2e8b4f; }
    .rv-status.rejected { background: #ffe6dd; color: #c4421b; }
    .my-review .review-meta a { color: var(--c-main); }

    /* 추천 이유 */
    .why-box { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 4px 0 10px; }
    .why-title { font-size: .75rem; font-weight: 800; color: var(--c-main); margin-right: 2px; }
    .why {
      font-size: .78rem; font-weight: 700; color: var(--c-main-dark); background: var(--c-main-soft);
      border: 1px solid #c7d5fb; border-radius: 4px; padding: 2px 8px;
    }

    /* 강좌 가격 · 수강 기간 · 교재 */
    .ptags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .ptag {
      display: inline-flex; align-items: center; gap: 5px; font-size: .78rem; font-weight: 700;
      padding: 3px 8px; border-radius: 4px; border: 1px solid var(--c-line); background: #fff; color: var(--c-text);
    }
    .ptag em { font-style: normal; font-weight: 500; color: var(--c-muted); white-space: nowrap; flex-shrink: 0; align-self: flex-start; }
    .ptag.book { align-items: flex-start; line-height: 1.45; }
    .ptag.price { border-color: #c7d5fb; background: var(--c-main-soft); color: var(--c-main-dark); }
    .ptag.days { background: #f6f8fb; }
    .ptag.book { background: #fffaf0; border-color: #f0e2bf; }
    .course-sub { font-size: .85rem; font-weight: 800; color: var(--c-main-dark); margin: 10px 0 2px; padding-top: 12px; border-top: 1px dashed var(--c-line); }
    .price-note { font-size: .75rem; color: var(--c-muted); margin-top: 10px; line-height: 1.5; }

    /* 결과 저장 */
    .save-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--c-line); }
    .save-btn {
      padding: 10px 18px; font-family: var(--font-ko); font-size: .9rem; font-weight: 700;
      background: #fff; color: var(--c-text); border: 1px solid var(--c-line); border-radius: 6px; cursor: pointer;
    }
    .save-btn:hover { border-color: var(--c-main); color: var(--c-main); }
    .save-btn.done { background: #e9f7ee; color: #2e8b4f; border-color: #a9dcbb; cursor: default; }
    .save-btn.ghost { color: var(--c-sub); }
    .saved-item {
      display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
      padding: 12px; border: 1px solid var(--c-line); border-radius: 8px; margin-bottom: 8px;
    }
    .saved-item:hover { border-color: #b9c8ee; }
    .saved-main { flex: 1; min-width: 180px; cursor: pointer; }
    .saved-date { font-size: .78rem; color: var(--c-muted); }
    .saved-subj { font-weight: 800; color: var(--c-text); margin: 2px 0; }
    .saved-top { font-size: .85rem; color: var(--c-sub); white-space: pre-wrap; }
    .saved-teacher { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f0f2f6; }
    .saved-rank {
      width: 26px; height: 26px; border-radius: 4px; background: var(--c-main); color: #fff;
      font-weight: 800; font-size: .85rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .saved-tmain { flex: 1; }

    /* PDF로 저장 / 인쇄: 결과 카드만 출력 */
    @media print {
      body { background: #fff !important; overflow: visible !important; }
      .gnb, .search-panel, .search-dim, #intro, .modal-bg, .my-panel,
      .screen:not(#result-screen), .btn-row, .save-row, .summary-toggle,
      .card-actions, .detail-btn { display: none !important; }
      #result-screen { display: block !important; padding: 0 !important; min-height: 0 !important; }
      .result-card { border: none !important; box-shadow: none !important; max-width: 100% !important; padding: 0 !important; animation: none !important; }
      .summary-panel { display: block !important; }
      .teacher-recommendation { break-inside: avoid; opacity: 1 !important; transform: none !important; }
    }

    /* 선생님 검색 */
    .gnb-menu button.on { color: var(--c-main); background: var(--c-main-soft); }
    .search-panel {
      display: none; position: absolute; top: var(--gnb-h); left: 0; right: 0;
      background: #fff; border-bottom: 1px solid var(--c-line); box-shadow: 0 8px 24px rgba(15, 25, 50, .12);
    }
    .search-panel.open { display: block; }
    .search-inner { max-width: 760px; margin: 0 auto; padding: 18px 20px 20px; }
    .search-box { display: flex; align-items: center; gap: 8px; border: 2px solid var(--c-main); border-radius: 8px; padding: 0 6px 0 14px; }
    .search-box input {
      flex: 1; border: none; outline: none; font-family: var(--font-ko); font-size: 1rem;
      padding: 13px 0; color: var(--c-text); background: none;
    }
    .search-close {
      width: 34px; height: 34px; border: none; background: none; color: var(--c-muted);
      font-size: 1rem; cursor: pointer; border-radius: 6px;
    }
    .search-close:hover { background: #f3f5f8; color: var(--c-text); }
    .search-results { max-height: 55vh; overflow-y: auto; margin-top: 10px; }
    .search-empty, .search-count { font-size: .88rem; color: var(--c-muted); padding: 10px 4px; }
    .search-count { padding: 4px 4px 6px; }
    .search-item {
      display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
      padding: 10px 10px; border: none; border-bottom: 1px solid #f0f2f6; background: #fff;
      font-family: var(--font-ko); cursor: pointer;
    }
    .search-item:hover, .search-item.sel { background: var(--c-main-soft); }
    .search-avatar {
      flex-shrink: 0; width: 38px; height: 38px; border-radius: 50%; background: var(--c-main);
      color: #fff; font-weight: 800; display: flex; align-items: center; justify-content: center;
    }
    .search-main { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .search-name { font-weight: 800; color: var(--c-text); font-size: .98rem; }
    .search-meta { font-size: .8rem; color: var(--c-sub); }
    .search-why { font-size: .78rem; color: var(--c-main); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .search-item mark { background: #fff1a8; color: inherit; padding: 0 1px; border-radius: 2px; }
    .search-go { font-size: .8rem; font-weight: 700; color: var(--c-main); flex-shrink: 0; }
    .search-dim { display: none; position: fixed; inset: 0; z-index: 39; background: rgba(15, 25, 50, .25); }
    .search-dim.open { display: block; }

    @media (max-width: 700px) {
      .gnb-logo { font-size: 1.6rem; }
      .gnb-menu button { padding: 8px 8px; font-size: .85rem; }
      .my-panel { top: auto; }
    }
  </style>
</head>

<body class="intro-on">

  <!-- ===== 인트로 ===== -->
  <div id="intro">
    <canvas id="intro-canvas"></canvas>
    <button class="skip-btn" id="skip-intro">건너뛰기</button>
  </div>

  <!-- ===== 시작 ===== -->
  <!-- ===== 상단 메뉴 (강의 사이트 스타일) ===== -->
  <header class="gnb">
    <div class="gnb-inner">
      <button class="gnb-logo" onclick="goScreen('start-screen')">Insegnante</button>
      <nav class="gnb-menu">
        <button id="search-toggle" onclick="toggleSearch()">선생님 찾기</button>
        <button onclick="openAllFromNav()">전체 선생님</button>
        <button onclick="location.href='reviews.html'">수강 후기</button>
        <button onclick="location.href='write.html'">후기 쓰기</button>
        <button onclick="openMyTeachers()">내 선생님</button>
        <button onclick="openSavedResults()">저장한 결과</button>
        <button onclick="openReport()">정보 제보</button>
        <button id="gnb-admin" class="gnb-admin" onclick="openAdmin()" style="display:none">관리자</button>
      </nav>
      <div class="gnb-auth" id="gnb-auth"></div>
    </div>
    <!-- 선생님 검색 -->
    <div class="search-panel" id="search-panel">
      <div class="search-inner">
        <div class="search-box">
          <input id="search-input" type="text" autocomplete="off"
            placeholder="강사 이름, 과목, 플랫폼, 강좌명으로 검색 (예: 현우진, ㅎㅇㅈ, 화학, 시발점)"
            oninput="renderSearch(this.value)" onkeydown="searchKey(event)">
          <button class="search-close" onclick="toggleSearch(false)" aria-label="검색 닫기">✕</button>
        </div>
        <div class="search-results" id="search-results"></div>
      </div>
    </div>
  </header>
  <div class="search-dim" id="search-dim" onclick="toggleSearch(false)"></div>

  <div id="start-screen" class="screen active">
    <!-- 내 선생님 (과목별 얼굴 + 인증 수강률) -->
    <aside class="my-panel" id="my-panel"></aside>
    <div class="title-container">
      <h1 class="title">Insegnante</h1>
      <p class="subtitle">나에게 딱 맞는 강사를 찾아드립니다</p>
    </div>
    <div class="silhouette-container">
      <div class="glow-ring"></div>
      <div class="glow-ring"></div>
      <img src="silhouette-clean.png" alt="강사 실루엣">
    </div>
    <div class="start-row">
      <button class="start-btn" onclick="startQuiz()">시작하기</button>
    </div>
  </div>

  <!-- ===== 질문 ===== -->
  <div id="question-screen" class="screen">
    <div class="question-card" id="question-card">
      <div class="progress-wrapper">
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <span class="progress-text" id="progress-text">0%</span>
      </div>
      <button class="back-btn hidden" id="back-btn" onclick="goBack()">← 이전</button>
      <div class="q-body" id="q-body">
        <p class="question-number" id="question-number"></p>
        <h2 class="question-text" id="question-text"></h2>
        <p class="question-hint" id="question-hint"></p>
        <div class="options-container" id="options-container"></div>
      </div>
    </div>
  </div>

  <!-- ===== 분석 중 ===== -->
  <div id="loading-screen" class="screen">
    <div class="spinner"></div>
    <div class="loading-text">분석 중...</div>
    <div class="loading-sub">당신에게 딱 맞는 선생님을 찾고 있어요</div>
    <div class="loading-steps">
      <div class="loading-step" id="ls1"><span class="step-icon">⏳</span> 응답 데이터 분석 중</div>
      <div class="loading-step" id="ls2"><span class="step-icon">⏳</span> 강사 데이터베이스 검색 중</div>
      <div class="loading-step" id="ls3"><span class="step-icon">⏳</span> 적합도 계산 중</div>
      <div class="loading-step" id="ls4"><span class="step-icon">⏳</span> 추천 결과 생성 중</div>
    </div>
  </div>

  <!-- ===== 결과 ===== -->
  <div id="result-screen" class="screen">
    <div class="result-card" id="result-card">
      <h2 class="result-title">🎓 추천 결과</h2>
      <p class="result-subtitle" id="result-subtitle"></p>
      <button class="summary-toggle" onclick="toggleSummary()">내 답변 보기 <span id="summary-arrow">▼</span></button>
      <div class="summary-panel" id="summary-panel"></div>
      <div id="result-list"></div>
      <div class="btn-row">
        <button class="share-btn" onclick="openAllTeachers()">다른 선생님도 보기</button>
        <button class="restart-btn" onclick="restart()">다시 찾기</button>
      </div>
      <div class="save-row">
        <button class="save-btn" id="save-result-btn" onclick="saveResult()">결과 저장</button>
        <button class="save-btn" onclick="printResult()">PDF로 저장 / 인쇄</button>
        <button class="save-btn ghost" onclick="openSavedResults()">저장한 결과 보기</button>
      </div>
    </div>
  </div>

  <!-- ===== 전체 선생님 ===== -->
  <div id="all-screen" class="screen">
    <div class="result-card">
      <button class="back-btn" onclick="backFromAll()">← 추천 결과로</button>
      <h2 class="result-title">📚 전체 선생님</h2>
      <p class="result-subtitle">과목과 플랫폼을 골라 둘러보세요</p>
      <div class="filter-row" id="subject-filter"></div>
      <div class="filter-row small" id="platform-filter"></div>
      <p class="all-count" id="all-count"></p>
      <div id="all-list"></div>
      <p class="report-hint">목록에 없는 선생님이 있거나 강좌·소속이 바뀌었나요? <button class="report-link" onclick="openReport({ subject: allFilter.subject })">정보 제보 · 수정 요청하기 ›</button></p>
      <div class="btn-row">
        <button class="share-btn" onclick="backFromAll()">← 추천 결과로</button>
        <button class="restart-btn" onclick="restart('all-screen')">다시 찾기</button>
      </div>
    </div>
  </div>

  <div id="admin-screen" class="screen">
    <div class="result-card admin-card">
      <h2 class="result-title">관리자 페이지</h2>
      <p class="result-subtitle" id="admin-who"></p>
      <div class="filter-row" id="admin-tabs"></div>
      <div id="admin-body"></div>
    </div>
  </div>

  <!-- ===== 강사 상세 팝업 ===== -->
  <div class="modal-bg" id="detail-modal" onclick="if(event.target===this)closeDetail()">
    <div class="modal" id="detail-body"></div>
  </div>

  <script src="teacher-courses.js"></script>
  <script src="course-prices.js"></script>
  <script src="ebs-courses.js"></script>
  <script>
    /* ===== 파티클 ===== */
    !function () {
      for (let i = 0; i < 30; i++) {
        const p = document.createElement('div'); p.className = 'particle';
        p.style.left = Math.random() * 100 + 'vw'; p.style.animationDuration = (Math.random() * 10 + 8) + 's';
        p.style.animationDelay = (Math.random() * 10) + 's'; const s = (Math.random() * 3 + 2) + 'px';
        p.style.width = s; p.style.height = s; document.body.appendChild(p)
      }
    }();

    /* ===== 화면 전환 헬퍼 ===== */
    function switchScreen(from, to) {
      const f = document.getElementById(from);
      const t = document.getElementById(to);
      f.classList.add('fade-out');
      setTimeout(() => {
        f.classList.remove('active', 'fade-out', 'fade-in');
        f.style.display = 'none';
        t.style.display = 'flex';
        t.classList.add('active', 'fade-in');
        document.body.style.overflow = (to === 'start-screen') ? 'hidden' : 'auto';
        window.scrollTo(0, 0);
        // 안전장치: 애니메이션이 멈춰도 화면이 반드시 보이도록 끝난 뒤 효과 제거
        setTimeout(() => t.classList.remove('fade-in'), 450);
      }, 400);
    }

    /* ===== 질문 데이터 ===== */
    const baseQuestions = [
      {
        key: 'subject', stage: '기본 정보', question: '어떤 과목 선생님을 찾고 계신가요?', hint: '', grid: false,
        options: [
          { text: '수학', value: 'math' }, { text: '국어', value: 'korean' },
          { text: '영어', value: 'english' },
          { text: '과학', value: 'science' }, { text: '사회', value: 'social' }
        ]
      },

      // 과학 세부과목 (subject=science 일때만)
      {
        key: 'subSubject', stage: '기본 정보', condition: a => a.subject === 'science',
        question: '과학 세부 과목을 선택해주세요', hint: '', grid: true,
        options: [
          { text: '물리학', value: 'physics' }, { text: '화학', value: 'chemistry' },
          { text: '생명과학', value: 'biology' }, { text: '지구과학', value: 'earth' },
          { text: '통합과학 (2022 개정)', value: 'integrated_sci' }
        ]
      },

      // 사회 세부과목 (subject=social 일때만)
      {
        key: 'subSubject', stage: '기본 정보', condition: a => a.subject === 'social',
        question: '사회 세부 과목을 선택해주세요', hint: '', grid: true,
        options: [
          { text: '한국사', value: 'history_kr' }, { text: '세계사 / 동아시아사', value: 'history_world' },
          { text: '사회문화', value: 'society' }, { text: '생활과윤리 / 윤리와사상', value: 'ethics' },
          { text: '한국지리 / 세계지리', value: 'geography' }, { text: '경제', value: 'economy' },
          { text: '정치와법', value: 'law' }, { text: '통합사회 (2022 개정)', value: 'integrated_soc' }
        ]
      },

      {
        key: 'level', stage: '나의 현재 위치', question: '현재 자신의 학습 수준은 어느 정도인가요?', hint: '', grid: false,
        options: [
          { text: '기초부터 다시 잡고 싶어요 (6~9등급)', value: 'basic' },
          { text: '중위권에서 올라가고 싶어요 (3~5등급)', value: 'mid' },
          { text: '상위권을 유지/돌파하고 싶어요 (1~2등급)', value: 'top' }
        ]
      },

      {
        key: 'courseType', stage: '나의 목표', question: '어떤 유형의 강좌를 찾으시나요?',
        hint: '목적에 맞는 강좌를 골라드릴게요', grid: false,
        options: [
          { text: '기초 개념 — 처음부터 차근차근', value: 'basic_concept' },
          { text: '개념 복습 (단기특강) — 빠르게 정리', value: 'review' },
          { text: '심화 개념 — 깊이 있는 이해', value: 'advanced' },
          { text: '내신 대비 — 학교 시험 집중', value: 'school_exam' },
          { text: '모의고사 대비 — 수능/모의고사 실전', value: 'mock_exam' }
        ]
      },

    // EBS와 다른 사이트에서 같은 과목을 함께 강의하는 선생님 (같은 사람으로 보고 사이트를 합침)
    const EBS_IDS = {};   // 이름 → EBSi 강사코드 (아래 TEACHER_IDS 에 연결)
    const EBS_SAME_PERSON = ['정승제', '주혜연', '이하영', '정상모', '이미지', '신영철'];

    (function applyEBS() {
      const isEBS = t => t.platform.includes('EBS');
      const inRoster = t => EBS_ROSTER.some(([n, s, ss]) => n === t.name && s === t.subject && (ss || null) === (t.subSubject || null));
      // 1) 명단에 없는 EBS 강사 정리 (다른 사이트도 함께 하는 강사는 EBS 표시만 뺌)
      for (let i = teachers.length - 1; i >= 0; i--) {
        const t = teachers[i];
        if (!isEBS(t) || inRoster(t) || EBS_SAME_PERSON.includes(t.name)) continue;
        const others = t.platform.split('/').map(x => x.trim()).filter(x => x !== 'EBS');
        if (others.length) t.platform = others.join(' / ');
        else teachers.splice(i, 1);
      }
      // 2) 추가 / 합치기
      const subjName = { korean: '국어', math: '수학', english: '영어', science: '과학', social: '사회' };
      EBS_ROSTER.forEach(([name, subject, subSubject, track, code, head]) => {
        EBS_IDS[name] = code;
        const same = t => t.name === name && t.subject === subject && (t.subSubject || null) === (subSubject || null);
        const existing = teachers.find(same);
        if (existing) { if (!isEBS(existing)) existing.platform += ' / EBS'; return; }
        const base = teachers.find(t => t.name === name && t.subject === subject && (isEBS(t) || EBS_SAME_PERSON.includes(name)));
        if (base) {   // 같은 선생님의 다른 세부과목
          teachers.push({ ...base, subSubject, platform: isEBS(base) ? base.platform : base.platform + ' / EBS', track: track || base.track });
          return;
        }
        teachers.push({
          name, platform: 'EBS', subject, subSubject, track: track || null, partial: true,
          gender: null, paid: false, style: null, board: null, energy: null, note: null, priority: null,
          level: null, course: null,
          desc: head ? `"${head}" — EBS ${subjName[subject]} 강사 (무료 강의)` : `EBS ${subjName[subject]} 강사 (무료 강의)`
        });
      });
      teachers.forEach(t => { if (EBS_SAME_PERSON.includes(t.name) && !isEBS(t)) t.platform += ' / EBS'; });
    })();

    /* ===== 레이블 맵 (답변 요약용) ===== */

    };
    const questionLabel = {
      subject: '과목', subSubject: '세부 과목', courseType: '강좌 유형', level: '학습 수준', style: '수업 스타일',
      board: '강의 화면', energy: '텐션', noteStyle: '필기 스타일', gender: '성별', paid: '유·무료',
      platform: '플랫폼', avoidPlatform: '덜 선호하는 사이트', priority: '중요 요소'
    };

    /* ===== 상태 ===== */
    let activeQuestions = [];   // 조건 필터링된 질문 배열
    let currentIndex = 0;
    let answers = {};

    function buildActiveQuestions() {
      activeQuestions = baseQuestions.filter(q => !q.condition || q.condition(answers));
    }

    /* ===== 시작 ===== */
    function startQuiz() {
      answers = {};
      currentIndex = 0;
      buildActiveQuestions();
      switchScreen('start-screen', 'question-screen');
      setTimeout(() => showQuestion(0, 'first'), 420);
    }

    /* ===== 질문 표시 =====
       dir: 'next'(왼쪽으로 넘김) / 'prev'(오른쪽으로 되돌림) / 'first'(처음 등장) */
    const Q_OUT_MS = 200;
    let qBusy = false;

    function showQuestion(idx, dir = 'next') {
      buildActiveQuestions();
      if (idx >= activeQuestions.length) { idx = activeQuestions.length - 1; }
      currentIndex = idx;
      const q = activeQuestions[idx];
      const body = document.getElementById('q-body');
      const inDir = dir === 'prev' ? 'prev' : 'next';

      // 진행바·이전 버튼은 바로 갱신
      const pct = Math.round(idx / activeQuestions.length * 100);
      document.getElementById('progress-fill').style.width = pct + '%';
      document.getElementById('progress-text').textContent = pct + '%';
      document.getElementById('back-btn').classList.toggle('hidden', idx === 0);

      const render = () => {
        document.getElementById('question-number').innerHTML =
          (q.stage ? `<span class="question-stage">${q.stage}</span><br>` : '') + `질문 ${idx + 1} / ${activeQuestions.length}`;
        document.getElementById('question-text').textContent = q.question;
        document.getElementById('question-hint').textContent = q.hint || '';

        const c = document.getElementById('options-container');
        c.innerHTML = '';
        c.className = q.grid ? 'options-container options-grid' : 'options-container';
        q.options.filter(opt => !q.optionFilter || q.optionFilter(opt, answers)).forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'option-btn' + (answers[q.key] === opt.value ? ' selected' : '');
          btn.textContent = opt.text;
          btn.onclick = () => selectOption(q.key, opt.value, btn);
          c.appendChild(btn);
        });

        body.classList.remove('q-out-next', 'q-out-prev', 'q-in-next', 'q-in-prev');
        void body.offsetWidth;
        body.classList.add('q-in-' + inDir);
        setTimeout(() => { body.classList.remove('busy'); qBusy = false; }, 300);
      };

      qBusy = true;
      body.classList.add('busy');
      if (dir === 'first') { render(); return; }
      // 지금 질문을 옆으로 밀어낸 뒤 새 질문을 반대편에서 들여옴
      body.classList.remove('q-in-next', 'q-in-prev');
      void body.offsetWidth;
      body.classList.add('q-out-' + inDir);
      setTimeout(render, Q_OUT_MS);
    }

    function selectOption(key, value, btn) {
      if (qBusy) return;
      qBusy = true;
      document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      answers[key] = value;

      // 과목 바뀌면 세부과목 초기화
      if (key === 'subject') delete answers.subSubject;

      setTimeout(() => {
        buildActiveQuestions();
        currentIndex++;
        if (currentIndex < activeQuestions.length) showQuestion(currentIndex);
        else {
          document.getElementById('progress-fill').style.width = '100%';
          document.getElementById('progress-text').textContent = '100%';
          setTimeout(() => { qBusy = false; showLoading(); }, 250);
        }
      }, 200);   // 선택한 답이 잠깐 보이도록
    }

    function goBack() {
      if (qBusy) return;
      if (currentIndex > 0) { currentIndex--; showQuestion(currentIndex, 'prev'); }
    }

    /* ===== 로딩 애니메이션 ===== */
    function showLoading() {
      switchScreen('question-screen', 'loading-screen');
      const steps = ['ls1', 'ls2', 'ls3', 'ls4'];
      steps.forEach((id, i) => {
        const el = document.getElementById(id);
        el.classList.remove('active', 'done');
        el.querySelector('.step-icon').textContent = '⏳';
      });

      steps.forEach((id, i) => {
        setTimeout(() => {
          const el = document.getElementById(id);
          el.classList.add('active');
          el.querySelector('.step-icon').textContent = '🔄';
        }, i * 700 + 500);
        setTimeout(() => {

          el.classList.remove('active');
          el.classList.add('done');
          el.querySelector('.step-icon').textContent = '✅';
