    /* =====================================================================
       강사 프로필 추론: 실제 강좌명·강사 특징·가격에서 수업 성향을 읽어냄
       - 직접 정리한 정보(t.course 등)가 있으면 그대로 쓰고, 실제 강좌에서 찾은 근거를 더함
       - 정보가 없는 항목은 null (모름) → 점수 계산에서 '중간'으로 처리
       ===================================================================== */
    const RX = {
      basic_concept: /기초|입문|베이직|basic|start|시작|노베|왕기초|pre[-\s]|first|올인원|all ?in ?one|개념 ?완성|개념서|개념편|zero|제로|step ?1|준비/i,
      review: /단기|압축|요약|총정리|summary|speed|스피드|벼락|한 ?번에|\d+강으로|\d+일 ?완성|\d+차시|정리 ?특강|핵심 ?정리|복습/i,
      advanced: /심화|고난도|킬러|high|최상위|특난도|n제|expert|advanced|1등급|만점|hard|하드/i,
      school_exam: /내신|학교시험|교과서|중간고사|기말|학평 ?변형|직전 ?대비|완자|개념원리|rpm|자이스토리|부교재|공통수학|공통국어|공통영어|통합과학|통합사회|대수|미적분ⅰ|미적분i\b/i,
      mock_exam: /모의고사|실모|파이널|final|기출|n제|실전|모평|평가원/i
    };
    const LV = {
      basic: /기초|입문|노베|왕기초|쉬운|쉽게|basic|start|처음|시작|zero|제로|중학|예비 ?고1|영포자|수포자|기본기/i,
      top: /발전|킬러|고난도|최상위|1등급|만점|특난도|high|최고난도|hard|하드|상위권|극한/i
    };
    const STY = {
      concept: /개념|원리|이해|본질|구조/i,
      problem: /n제|문제 ?풀이|봉투|문풀|기출|모의고사|실전|training|트레이닝/i,
      killer: /킬러|고난도|특난도|최상위|4점|준킬러|hard/i,
      fun: /재미|재밌|유머|스토리|입담|웃|즐겁|힐링|요정|개그|흥미|쉽고 재/i
    };
    const PRI = {
      material: /교재|워크북|노트|자료|프린트|서브노트|e-?book|교과서/i,
      curriculum: /커리|단계|시즌|step|체계|로드맵|순환/i,
      efficiency: /압축|단기|요약|빠르|스피드|짧|효율|\d+강으로|\d+일 ?완성|시간 ?단축/i,
      explanation: /설명|원리|이해|개념|친절|꼼꼼/i,
      motivation: /동기|멘탈|열정|응원|파이팅|함께|페이스메이커|힐링/i
    };

    // "정가 120,000원 → 84,000원" → 84000, "무료" → 0
    function parsePrice(p) {
      if (!p) return null;
      if (/무료/.test(p)) return 0;
      const nums = String(p).match(/[\d,]+(?=원)/g);
      if (!nums) return null;
      return Number(nums[nums.length - 1].replace(/,/g, ''));
    }

    const profileCache = new Map();
    function teacherProfile(t) {
      const key = t.name + '|' + t.subject + '|' + t.subSubject;
      if (profileCache.has(key)) return profileCache.get(key);
      const info = teacherDetails[t.name] || {};
      const priced = (window.COURSE_PRICES && window.COURSE_PRICES[t.name]) || [];
      let titles = [...(info.courses || []).map(c => c.title + ' ' + (c.desc || '')), ...priced.map(e => e.t)];
      // 여러 세부과목을 가르치는 강사: 이번 세부과목과 관련된 강좌만 사용 (예: 사회문화로 추천할 때 정치와법 강좌는 제외)
      let subjectMismatch = false;
      if (t.subSubject && SUB_RX[t.subSubject]) {
        const mentionsOther = x => Object.keys(SUB_RX).some(k => k !== t.subSubject && SUB_RX[k].test(x));
        const relevant = titles.filter(x => SUB_RX[t.subSubject].test(x) || !mentionsOther(x));
        if (titles.length && !titles.some(x => SUB_RX[t.subSubject].test(x)) && titles.every(mentionsOther)) subjectMismatch = true;
        titles = relevant;
      }
      const featureText = [(info.features || []).join(' '), t.desc || '', t.track || ''].join(' ');
      const all = titles.join(' \n ') + ' ' + featureText;

      // 강좌 유형별 실제 강좌 수
      const courseCount = {};
      Object.keys(RX).forEach(k => { courseCount[k] = titles.filter(x => RX[k].test(x)).length; });
      const course = new Set(t.course || []);
      Object.keys(courseCount).forEach(k => { if (courseCount[k] > 0) course.add(k); });
      const g12 = /고1·2/.test(t.track || '') || (titles.length && titles.filter(x => RX.school_exam.test(x)).length >= titles.length * .6);
      if (g12) course.add('school_exam');

      // 학습 수준
      let level = t.level ? new Set(t.level) : null;
      const basicHits = titles.filter(x => LV.basic.test(x)).length + (LV.basic.test(featureText) ? 1 : 0);
      const topHits = titles.filter(x => LV.top.test(x)).length + (LV.top.test(featureText) ? 1 : 0);
      if (!level && titles.length) {
        level = new Set();
        if (g12) { level.add('basic'); level.add('mid'); }
        if (basicHits) level.add('basic');
        if (topHits) level.add('top');
        level.add('mid');           // 수능 강좌가 있는 강사는 중위권에는 대체로 맞음
      }

      // 수업 스타일
      let style = t.style ? new Set(t.style) : null;
      if (!style && titles.length) {
        style = new Set();
        Object.keys(STY).forEach(k => {
          const hits = (k === 'fun' ? (STY.fun.test(featureText) ? 1 : 0) : titles.filter(x => STY[k].test(x)).length);
          if (hits >= (k === 'concept' || k === 'problem' ? 2 : 1)) style.add(k);
        });
      }

      // 중요하게 보는 것
      let priority = t.priority ? new Set(t.priority) : null;
      if (!priority && (titles.length || featureText.trim())) {
        priority = new Set();
        Object.keys(PRI).forEach(k => { if (PRI[k].test(all)) priority.add(k); });
        if (Object.values(courseCount).filter(n => n > 0).length >= 3) priority.add('curriculum');
      }

      const energy = t.energy || (/텐션|열정|에너지|파이팅|화끈/.test(all) ? 'high' : /차분|잔잔|조용/.test(all) ? 'calm' : null);
      const board = t.board || (/판서/.test(all) ? 'board' : /ppt/i.test(all) ? 'ppt' : null);
      const note = t.note != null ? t.note : (/필기|판서|노트/.test(all) ? true : null);

      // 평균 강좌 가격 (가성비 판단용)
      const isEBS = t.platform.split('/').every(p => p.trim() === 'EBS');
      const prices = priced.map(e => parsePrice(e.p)).filter(v => v != null && v > 0);
      const avgPrice = isEBS ? 0 : prices.length ? Math.round(prices.reduce((s, v) => s + v, 0) / prices.length) : null;
      const free = isEBS || t.paid === false || t.paid === 'both';

      const p = { course, courseCount, level, style, priority, energy, board, note, avgPrice, free, g12, subjectMismatch, titlesCount: titles.length };
      profileCache.set(key, p);
      return p;
    }

    // 세부과목을 알아보는 단어 (강좌명에 다른 과목명이 있으면 그 과목 강좌로 봄)
    const SUB_RX = {
      physics: /물리/, chemistry: /화학/, biology: /생명|생Ⅰ|생Ⅱ/, earth: /지구과학|지구/,
      history_kr: /한국사|한능검/, history_world: /세계사|동아시아/, society: /사회문화|사회와 ?문화|사문/,
      ethics: /윤리|윤사|생윤/, geography: /지리/, economy: /경제/, law: /정치|법과|정법/,
      integrated_sci: /통합과학/, integrated_soc: /통합사회|통사/
    };

    const LEVEL_ORDER = { basic: 0, mid: 1, top: 2 };
    const COURSE_LABEL = { basic_concept: '기초 개념', review: '개념 복습·단기특강', advanced: '심화', school_exam: '내신 대비', mock_exam: '모의고사·실전' };

    // 질문별 가중치 — 모든 질문이 골고루 반영되도록 비슷한 크기로 맞춤 (상관없어요는 계산에서 빠짐)
    const W_Q = { course: 5, level: 5, style: 4.5, board: 4, note: 3.5, energy: 4, gender: 3.5, paid: 4.5, platform: 4.5, priority: 4.5 };

    /* 추천 5명 고르기: 한 사이트에 몰리지 않게 다양하게
       - 이미 뽑힌 사이트의 선생님은 조금씩 감점해서, 점수가 비슷하면 다른 사이트 선생님을 먼저 뽑음
       - 학생이 선호 사이트를 골랐다면 그 선택을 존중해서 다양화하지 않음 */
    function pickTop(scored, a, n = 5) {
      const sorted = [...scored].sort((x, y) => y.score - x.score || y.evidence - x.evidence);
      if (a.platform && a.platform !== 'any_platform') return sorted.slice(0, n);
      const chosen = [], count = {};
      const pool = sorted.slice(0, 40);
      while (chosen.length < n && pool.length) {
        let bi = 0, bv = -Infinity;
        pool.forEach((t, i) => {
          const c = count[platformOf(t)] || 0;
          const v = t.score - DIVERSITY_PENALTY * c - (c >= 2 ? DIVERSITY_PENALTY : 0);   // 같은 사이트 3번째부터는 더 감점
          if (v > bv) { bv = v; bi = i; }
        });
        const t = pool.splice(bi, 1)[0];
        chosen.push(t);
        count[platformOf(t)] = (count[platformOf(t)] || 0) + 1;
      }
      // 화면에는 점수 순으로 보여줌
      return chosen.sort((x, y) => y.score - x.score || y.evidence - x.evidence);
    }
    const DIVERSITY_PENALTY = .07;

    // 한 선생님의 적합도 계산 → { score, pct, reasons, evidence }
    function scoreTeacher(t, a) {
      const p = teacherProfile(t);
      const parts = [];            // [가중치, 0~1 일치도 또는 null(모름)]
      const reasons = [];
      const add = (w, m) => { if (m !== undefined) parts.push([w, m]); };

      // 1) 강좌 유형 (가장 중요) — 실제 강좌 수가 많을수록 확실
      if (a.courseType) {
        const n = p.courseCount[a.courseType] || 0;
        let m = n >= 3 ? 1 : n === 2 ? .92 : n === 1 ? .8 : p.course.has(a.courseType) ? .7 : (p.titlesCount ? .1 : null);
        add(W_Q.course, m);
        if (n) reasons.push(`${COURSE_LABEL[a.courseType]} 강좌 ${n}개`);
      }

      // 2) 학습 수준 — 바로 옆 수준이면 일부 인정
      if (a.level) {
        let m = null;
        if (p.level && p.level.size) {
          if (p.level.has(a.level)) m = 1;
          else m = [...p.level].some(l => Math.abs(LEVEL_ORDER[l] - LEVEL_ORDER[a.level]) === 1) ? .45 : 0;
        }
        // 상위권인데 고1·2 내신 위주 강사, 또는 수능 실전을 원하는데 고1·2 강사면 감점
        if (p.g12 && (a.level === 'top' || a.courseType === 'mock_exam' || a.courseType === 'advanced')) m = Math.min(m == null ? .5 : m, .25);
        add(W_Q.level, m);
        if (m === 1) reasons.push(`${labelMap.level[a.level].split(' ')[0]} 수준에 맞음`);
      }

      // 3) 수업 스타일
      if (a.style) {
        const m = p.style && p.style.size ? (p.style.has(a.style) ? 1 : .15) : null;
        add(W_Q.style, m);
        if (m === 1) reasons.push(labelMap.style[a.style] + ' 수업');
      }

      // 4) 강의 화면 (상관없어요 → 계산 제외)
      if (a.board && a.board !== 'any_board') {
        add(W_Q.board, p.board ? (p.board === a.board ? 1 : 0) : null);
        if (p.board === a.board) reasons.push(labelMap.board[a.board]);
      }

      // 5) 필기 스타일
      if (a.noteStyle && a.noteStyle !== 'any_note') {
        let m = null;
        if (a.noteStyle === 'note_yes') m = p.note == null ? null : (p.note ? 1 : 0);
        else if (a.noteStyle === 'note_no') m = p.note == null ? null : (p.note ? 0 : 1);
        else if (a.noteStyle === 'note_print') m = p.board ? (p.board === 'print' ? 1 : .3) : null;
        add(W_Q.note, m);
      }

      // 6) 텐션
      if (a.energy && a.energy !== 'any_energy') {
        let m = null;
        if (p.energy) m = p.energy === a.energy ? 1 : (a.energy === 'moderate' || p.energy === 'moderate') ? .5 : 0;
        add(W_Q.energy, m);
        if (m === 1) reasons.push(labelMap.energy[a.energy]);
      }

      // 7) 성별
      if (a.gender && a.gender !== 'any_gender') {
        add(W_Q.gender, t.gender ? (t.gender === a.gender ? 1 : 0) : null);
      }

      // 8) 유료/무료/가성비 — 실제 평균 강좌 가격 사용
      if (a.paid === 'free_only') {
        add(W_Q.paid, p.free ? 1 : 0);
        if (p.free) reasons.push('무료 강의 있음');
      } else if (a.paid === 'value') {
        let m = null;
        if (p.free) m = 1;
        else if (p.avgPrice != null) m = p.avgPrice <= 40000 ? 1 : p.avgPrice <= 70000 ? .8 : p.avgPrice <= 100000 ? .55 : p.avgPrice <= 140000 ? .3 : .15;
        add(W_Q.paid, m);
        if (p.avgPrice != null && m >= .8) reasons.push(p.avgPrice === 0 ? '무료 강의' : `평균 강좌 약 ${(p.avgPrice / 10000).toFixed(1)}만원`);
      }

      // 9) 선호 플랫폼
      if (a.platform && a.platform !== 'any_platform') {
        const pMap = { etoos: '이투스', ebs: 'EBS', mega: '메가스터디', daesung: '대성마이맥' };
        const ok = platformsOf(t).some(x => x.includes(pMap[a.platform]));
        add(W_Q.platform, ok ? 1 : 0);
        if (ok) reasons.push(pMap[a.platform] + ' 강의');
      }

      // 10) 중요하게 생각하는 것
      if (a.priority) {
        const m = p.priority && p.priority.size ? (p.priority.has(a.priority) ? 1 : .25) : null;
        add(W_Q.priority, m);
        if (m === 1) reasons.push(labelMap.priority[a.priority] + ' 강점');
      }

      // 모르는 항목(null)은 0.5로 계산하되, 많이 모를수록 살짝 불리하게 (확실한 근거가 있는 강사를 우선)
      let wSum = 0, sSum = 0, known = 0, total = 0;
      parts.forEach(([w, m]) => { wSum += w; total += w; if (m == null) sSum += w * .5; else { sSum += w * m; known += w; } });
      let pct = wSum ? sSum / wSum : .5;
      const confidence = total ? known / total : 0;
      pct = pct * (.85 + .15 * confidence);

      // 꼭 지켜야 하는 조건: 무료만 원하는데 유료 강사, 상위권·실전 요청인데 고1·2 내신 강사, 다른 세부과목 강사
      if (a.paid === 'free_only' && !p.free) pct *= .55;
      if (p.g12 && (a.level === 'top' || a.courseType === 'mock_exam' || a.courseType === 'advanced')) pct *= .7;
      if (p.subjectMismatch) pct *= .45;

      // 덜 선호하는 사이트에서'만' 강의하면 크게 감점
      let avoided = false;
      if (a.avoidPlatform && a.avoidPlatform !== 'none_avoid' && a.avoidPlatform !== a.platform) {
        const aMap = { etoos: '이투스', ebs: 'EBS', mega: '메가스터디', daesung: '대성마이맥' };
        if (platformsOf(t).every(x => x.includes(aMap[a.avoidPlatform]))) { pct *= .45; avoided = true; }
      }

      const evidence = (p.courseCount[a.courseType] || 0) + confidence;
      return { ...t, score: pct, pct: Math.max(1, Math.min(100, Math.round(pct * 100))), reasons: reasons.slice(0, 4), avoided, evidence };
    }

    /* ===== 점수 산정 & 결과 ===== */
    function computeAndShowResult() {
      const a = answers;

      let pool = teachers.filter(t => t.subject === a.subject);
      // 세부과목 필터 (있으면)
      if (a.subSubject) {
        const sub = pool.filter(t => t.subSubject === a.subSubject);
        if (sub.length >= 1) pool = sub;            // 해당 세부과목 선생님이 있으면 그 안에서만 추천
        // else 전체 과목 풀 사용 (데이터 부족 시)
      }

      // 새 점수 계산: 실제 강좌 데이터로 만든 강사 프로필 + '상관없어요' 제외 + 근거 기반
      let scored = pool.map(t => scoreTeacher(t, a))
        .sort((x, y) => y.score - x.score || y.evidence - x.evidence || (x.partial ? 1 : 0) - (y.partial ? 1 : 0));

      /* ===== (이전 방식은 아래 OLD_SCORING 에 남겨 둠, 사용하지 않음) ===== */
      const OLD_SCORING = () => pool.map(t => {
      const W = { course: 5, level: 5, style: 4, board: 3, energy: 3, note: 3, gender: 3, paid: 3, platform: 3, priority: 3 };
      const maxW = Object.values(W).reduce((s, v) => s + v, 0); // 35
        let s = 0;
        // 정보가 아직 없는 항목(null)은 중립 점수(절반)로 계산
        const HALF = .5;
        if (!t.course) s += W.course * HALF; else if (t.course.includes(a.courseType)) s += W.course;
        if (!t.level) s += W.level * HALF; else if (t.level.includes(a.level)) s += W.level;
        if (!t.style) s += W.style * HALF; else if (t.style.includes(a.style)) s += W.style;

        if (a.board === 'any_board' || !t.board) s += W.board * .5; else if (t.board === a.board) s += W.board;
        if (a.energy === 'any_energy' || !t.energy) s += W.energy * .5;
        else if (t.energy === a.energy) s += W.energy;
        else if (a.energy === 'moderate' && t.energy !== 'moderate') s += W.energy * .3;

        if (a.noteStyle === 'any_note' || t.note == null) s += W.note * .5;
        else if (a.noteStyle === 'note_yes' && t.note) s += W.note;
        else if (a.noteStyle === 'note_no' && !t.note) s += W.note;
        else if (a.noteStyle === 'note_print' && t.board === 'print') s += W.note;

        if (a.gender === 'any_gender' || !t.gender) s += W.gender * .5; else if (t.gender === a.gender) s += W.gender;

        if (a.paid === 'any_paid') s += W.paid * .5;
        else if (a.paid === 'paid_ok') s += (t.paid === true || t.paid === 'both') ? W.paid : W.paid * .3;
        else if (a.paid === 'free_only') s += (t.paid === false || t.paid === 'both') ? W.paid : 0;
        else if (a.paid === 'value') s += (t.paid === 'both' || t.paid === false) ? W.paid : W.paid * .4;

        if (a.platform === 'any_platform') s += W.platform * .5;
        else {
          const pMap = { etoos: '이투스', ebs: 'EBS', mega: '메가', daesung: '대성' };
          if (t.platform.toLowerCase().includes((pMap[a.platform] || '').toLowerCase())) s += W.platform;
        }
        if (!t.priority) s += W.priority * HALF; else if (t.priority.includes(a.priority)) s += W.priority;

        // 덜 선호하는 사이트: 그 사이트에서'만' 강의하는 선생님은 점수를 크게 낮춤 (다른 사이트도 있으면 감점 없음)
        let avoided = false;
        if (a.avoidPlatform && a.avoidPlatform !== 'none_avoid') {
          const aMap = { etoos: '이투스', ebs: 'EBS', mega: '메가스터디', daesung: '대성마이맥' };
          const sites = t.platform.split('/').map(p => p.trim());
          if (sites.every(p => p.includes(aMap[a.avoidPlatform]))) { s = Math.max(0, s - W.platform * 3); avoided = true; }
        }

        return { ...t, score: s, avoided, pct: Math.min(100, Math.round(s / maxW * 100)) };
      });

      const topN = pickTop(scored, a, 5);

      // 답변 요약
      const summaryPanel = document.getElementById('summary-panel');
      summaryPanel.classList.remove('open');
      document.getElementById('summary-arrow').textContent = '▼';
      let summaryHTML = '';
      for (const q of activeQuestions) {
        const v = answers[q.key];
        if (!v) continue;
        const lbl = questionLabel[q.key] || q.key;
        const val = (labelMap[q.key] && labelMap[q.key][v]) || v;
        summaryHTML += `<div class="summary-row"><span class="summary-label">${lbl}</span><span class="summary-value">${val}</span></div>`;
      }
      summaryPanel.innerHTML = summaryHTML;

      // 결과 부제
      const sub = document.getElementById('result-subtitle');
      sub.textContent = (topN.length && topN[0].pct >= 75)
        ? '✨ 당신에게 딱 맞는 선생님을 찾았어요!'
        : '당신의 조건에 가장 가까운 선생님들이에요.';

      // 카드
      const list = document.getElementById('result-list');
      list.innerHTML = '';
      const medals = ['🥇', '🥈', '🥉', '4️⃣', '5️⃣'];
      topN.forEach((t, i) => {
        let mc, ml;
        if (t.pct >= 75) { mc = 'match-high'; ml = `적합도 ${t.pct}%` }
        else if (t.pct >= 50) { mc = 'match-medium'; ml = `적합도 ${t.pct}%` }
        else { mc = 'match-low'; ml = `적합도 ${t.pct}%` }

        const tags = teacherTags(t);

        const d = document.createElement('div'); d.className = 'teacher-recommendation';
        d.innerHTML = `
      <div class="teacher-header">
        <span class="teacher-name">${medals[i]} ${t.name}</span>
        <span class="match-score ${mc}">${ml}</span>
      </div>
      <div class="teacher-platform">📌 ${t.platform}</div>
      <div class="teacher-desc">${esc(teacherDesc(t))}</div>
      ${t.reasons && t.reasons.length ? `<div class="why-box"><span class="why-title">추천 이유</span>${t.reasons.map(r => `<span class="why">${esc(r)}</span>`).join('')}</div>` : ''}
      <div class="teacher-tags">${tags.map(x => `<span class="tag">${x}</span>`).join('')}</div>
      <div class="card-actions"><button class="detail-btn">자세히 보기</button><button class="detail-btn review-btn">수강생 후기</button></div>`;
        d.querySelector('.detail-btn').onclick = () => openDetail(t);
        d.querySelector('.review-btn').onclick = () => openReviews(t);
        d.style.opacity = '0'; d.style.transform = 'translateY(20px)'; d.style.transition = 'all .4s ease';
        setTimeout(() => { d.style.opacity = '1'; d.style.transform = 'translateY(0)' }, i * 180 + 300);
        list.appendChild(d);
      });

      lastRecommended = topN.map(t => t.name + '|' + t.subSubject);
      // 저장용 결과 (저장 버튼을 누르면 이 내용이 기록됨)
      lastResult = {
        answers: { ...answers },
        subtitle: sub.textContent,
        top: topN.map(t => ({ name: t.name, platform: t.platform, subject: t.subject, subSubject: t.subSubject, pct: t.pct, desc: t.desc }))
      };
      resetSaveButton();
      switchScreen('loading-screen', 'result-screen');
    }

    // 카드 설명: 정보가 부족한 강사는 공식 페이지에서 확인한 특징으로 대신 보여줌
    function teacherDesc(t) {
      const f = (teacherDetails[t.name] || {}).features;
      if (t.partial && f && f.length) return f.join(' · ');
      return t.desc;
    }

    function teacherTags(t) {
      const tags = [];
      // 정보가 없는 항목은 태그를 만들지 않음
      if (t.energy) tags.push(t.energy === 'high' ? '🔥 텐션 높음' : t.energy === 'calm' ? '😌 차분' : '⚖️ 보통');
      if (t.board) tags.push(t.board === 'board' ? '✍️ 판서' : t.board === 'ppt' ? '🖥️ PPT' : '📋 프린트');
      if (t.note) tags.push('📝 필기 수업');
      tags.push(t.paid === false ? '🆓 무료' : t.paid === 'both' ? '🆓+💰' : '💰 유료');
      if (t.gender) tags.push(t.gender === 'male' ? '👨‍🏫 남자' : '👩‍🏫 여자');
      if (t.subSubject) { const n = labelMap.subSubject[t.subSubject]; if (n) tags.push('📚 ' + n) }
      if (t.track) tags.push('🎯 ' + t.track);
      if (t.partial && !((teacherDetails[t.name] || {}).courses || []).length) tags.push('ℹ️ 상세 정보 준비 중');
      return tags;
    }

    /* ===== 전체 선생님 보기 ===== */
    let lastRecommended = [];
    let allFilter = { subject: 'math', platform: 'all' };
    const platformFilters = [
      { key: 'all', label: '전체' }, { key: '메가스터디', label: '메가스터디' }, { key: '이투스', label: '이투스' },
      { key: '대성마이맥', label: '대성마이맥' }, { key: 'EBS', label: 'EBS' },
      { key: 'etc', label: '기타' }
    ];
    const mainPlatforms = ['메가스터디', '이투스', '대성마이맥', 'EBS'];

    /* ===== 선생님 검색 ===== */
    const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
    // '현우진' → 'ㅎㅇㅈ' (초성 검색용)
    function chosung(s) {
      return [...s].map(ch => {
        const c = ch.charCodeAt(0) - 0xAC00;
        return (c >= 0 && c <= 11171) ? CHO[Math.floor(c / 588)] : ch;
      }).join('');
    }
    const norm = s => String(s || '').toLowerCase().replace(/\s+/g, '');
    const isChosungOnly = s => /^[ㄱ-ㅎ]+$/.test(s);

    let searchHits = [];
    let searchSel = -1;

    function toggleSearch(force) {
      const panel = document.getElementById('search-panel');
      const open = force === undefined ? !panel.classList.contains('open') : force;
      panel.classList.toggle('open', open);
      document.getElementById('search-dim').classList.toggle('open', open);
      document.getElementById('search-toggle').classList.toggle('on', open);
      if (open) {
        const input = document.getElementById('search-input');
        input.value = '';
        renderSearch('');
        setTimeout(() => input.focus(), 50);
      }
    }

    // 같은 선생님이 여러 세부과목에 있어도 한 번만 표시
    function searchIndex() {
      const map = new Map();
      teachers.forEach(t => {
        let e = map.get(t.name);
        if (!e) {
          e = { t, name: t.name, platforms: new Set(), subjects: new Set(), courses: [] };
          map.set(t.name, e);
          e.courses = ((teacherDetails[t.name] || {}).courses || []).map(c => c.title);
        }
        t.platform.split('/').forEach(p => e.platforms.add(p.trim()));
        e.subjects.add(labelMap.subject[t.subject]);
        if (t.subSubject && labelMap.subSubject[t.subSubject]) e.subjects.add(labelMap.subSubject[t.subSubject]);
      });
      return [...map.values()];
    }

    function renderSearch(raw) {
      const box = document.getElementById('search-results');
      const q = norm(raw);
      searchSel = -1;
      if (!q) {
        searchHits = [];
        box.innerHTML = '<p class="search-empty">찾고 싶은 선생님의 이름을 입력해 보세요.</p>';
        return;
      }
      const cho = isChosungOnly(q);
      searchHits = searchIndex().map(e => {
        const name = norm(e.name);
        let score = 0, why = '';
        if (cho) {
          const c = chosung(e.name);
          if (c.startsWith(q)) score = 90; else if (c.includes(q)) score = 70;
        } else {
          if (name === q) score = 100;
          else if (name.startsWith(q)) score = 90;
          else if (name.includes(q)) score = 80;
          else if ([...e.subjects].some(s => norm(s).includes(q))) { score = 50; }
          else if ([...e.platforms].some(p => norm(p).includes(q))) { score = 40; }
          else {
            const c = e.courses.find(c => norm(c).includes(q));
            if (c) { score = 30; why = c; }
          }
        }
        return { ...e, score, why };
      }).filter(e => e.score > 0)
        .sort((a, b) => b.score - a.score || a.name.localeCompare(b.name, 'ko'))
        .slice(0, 30);

      if (!searchHits.length) {
        box.innerHTML = `<p class="search-empty">'${esc(raw)}'에 맞는 선생님이 없어요.</p>
          <button class="report-link" onclick='openReport({ type: "add", name: ${jsArgSafe(raw)} })'>찾는 선생님이 없나요? 추가 요청하기 ›</button>`;
        return;
      }
      box.innerHTML = `<p class="search-count">${searchHits.length}명${searchHits.length === 30 ? ' 이상' : ''}</p>` +
        searchHits.map((e, i) => `
        <button class="search-item" data-i="${i}" onclick="pickSearch(${i})">
          <span class="search-avatar">${esc(e.name.charAt(0))}</span>
          <span class="search-main">
            <span class="search-name">${highlight(e.name, raw)}</span>
            <span class="search-meta">${esc([...e.platforms].join(' · '))} | ${esc([...e.subjects].join(' · '))}</span>
            ${e.why ? `<span class="search-why">강좌: ${highlight(e.why, raw)}</span>` : ''}
          </span>
          <span class="search-go">자세히 ›</span>
        </button>`).join('');
    }

    // 일치하는 부분 굵게 표시
    function highlight(text, raw) {
      const q = String(raw || '').trim();
      if (!q || isChosungOnly(norm(q))) return esc(text);
      const i = text.toLowerCase().indexOf(q.toLowerCase());
      if (i < 0) return esc(text);
      return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
    }

    function pickSearch(i) {
      const e = searchHits[i];
      if (!e) return;
      toggleSearch(false);
      openDetail(e.t);
    }

    // ↑ ↓ 로 고르고 Enter 로 열기, Esc 로 닫기
    function searchKey(ev) {
      const items = [...document.querySelectorAll('.search-item')];
      if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
        ev.preventDefault();
        if (!items.length) return;
        searchSel = (searchSel + (ev.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
        items.forEach((b, i) => b.classList.toggle('sel', i === searchSel));
        items[searchSel].scrollIntoView({ block: 'nearest' });
      } else if (ev.key === 'Enter') {
        ev.preventDefault();
        pickSearch(searchSel >= 0 ? searchSel : 0);
      } else if (ev.key === 'Escape') {
        toggleSearch(false);
      }
    }

    /* ===== 상단 메뉴 이동 ===== */
    function goScreen(to) {
      closeDetail();
      const cur = document.querySelector('.screen.active');
      if (!cur || cur.id === to) return;
      switchScreen(cur.id, to);
    }

    function openAllFromNav() {
      allFilter = { subject: answers.subject || 'math', platform: 'all' };
      renderAllTeachers();
      goScreen('all-screen');
    }

    // 전체 선생님 → 추천 결과가 있으면 결과로, 없으면 처음 화면으로
    function backFromAll() {
      goScreen(lastRecommended.length ? 'result-screen' : 'start-screen');
    }

    function openAllTeachers() {
      allFilter = { subject: answers.subject || 'math', platform: 'all' };
      renderAllTeachers();
      switchScreen('result-screen', 'all-screen');
    }

    function renderAllTeachers() {
      const sf = document.getElementById('subject-filter');
      sf.innerHTML = '';
      Object.entries(labelMap.subject).forEach(([k, v]) => {
        const b = document.createElement('button');
        b.className = 'chip' + (allFilter.subject === k ? ' on' : '');
        b.textContent = v;
        b.onclick = () => { allFilter.subject = k; renderAllTeachers() };
        sf.appendChild(b);
      });

      const pf = document.getElementById('platform-filter');
      pf.innerHTML = '';
      platformFilters.forEach(p => {
        const b = document.createElement('button');
        b.className = 'chip' + (allFilter.platform === p.key ? ' on' : '');
        b.textContent = p.label;
        b.onclick = () => { allFilter.platform = p.key; renderAllTeachers() };
        pf.appendChild(b);
      });

      let list = teachers.filter(t => t.subject === allFilter.subject);
      if (allFilter.platform === 'etc') list = list.filter(t => !mainPlatforms.some(p => t.platform.includes(p)));
      else if (allFilter.platform !== 'all') list = list.filter(t => t.platform.includes(allFilter.platform));

      document.getElementById('all-count').textContent = `총 ${list.length}명의 선생님`;

      // 세부과목별로 묶어서 표시
      const groups = {};
      list.forEach(t => { const g = t.subSubject || '_'; (groups[g] = groups[g] || []).push(t) });

      const box = document.getElementById('all-list');
      box.innerHTML = '';
      if (!list.length) {
        box.innerHTML = '<p class="teacher-desc" style="text-align:center">조건에 맞는 선생님이 없어요.</p>';
        return;
      }
      Object.entries(groups).forEach(([g, arr]) => {
        if (g !== '_') {
          const h = document.createElement('div'); h.className = 'group-title';
          h.textContent = labelMap.subSubject[g] || g; box.appendChild(h);
        }
        arr.forEach(t => {
          const rec = lastRecommended.includes(t.name + '|' + t.subSubject);
          const d = document.createElement('div'); d.className = 'teacher-recommendation';
          d.innerHTML = `
        <div class="teacher-header">
          <span class="teacher-name">${t.name}</span>
          ${rec ? '<span class="match-score match-high">⭐ 추천됨</span>' : ''}
        </div>
        <div class="teacher-platform">📌 ${t.platform}</div>
        <div class="teacher-desc">${esc(teacherDesc(t))}</div>
        <div class="teacher-tags">${teacherTags(t).map(x => `<span class="tag">${x}</span>`).join('')}</div>
        <div class="card-actions"><button class="detail-btn">자세히 보기</button><button class="detail-btn review-btn">수강생 후기</button></div>`;
          d.querySelector('.detail-btn').onclick = () => openDetail(t);
          d.querySelector('.review-btn').onclick = () => openReviews(t);
          box.appendChild(d);
        });
      });
    }

      const first = t.platform.split('/')[0].trim();
      return Object.keys(PLATFORM_LINKS).find(p => first.includes(p)) || first;
    }

    function normPlatform(p) {
      p = p.trim();
      return Object.keys(PLATFORM_LINKS).find(x => p.includes(x)) || p;
    }

    // 이 선생님이 강의하는 모든 사이트 (예: "EBS / 이투스", 또는 같은 과목으로 여러 사이트 명단에 있는 경우)
    function platformsOf(t) {
      const list = [];
      const add = p => { p = normPlatform(p); if (p && !list.includes(p)) list.push(p); };
      t.platform.split('/').forEach(add);
      teachers.filter(o => o.name === t.name && o.subject === t.subject).forEach(o => o.platform.split('/').forEach(add));
      return list;
    }

    // 사이트 하나에 대한 링크: 1) 그 사이트의 커리큘럼 링크 → 2) 강사 ID 페이지 → 3) 사이트 과목별 강사 목록/홈
    function linkFor(t, p, info = teacherDetails[t.name] || {}) {
      // 관리자가 직접 넣은 공식 페이지 링크가 가장 우선
      if (info.adminLink) return { url: info.adminLink, kind: 'teacher' };
      // 메가스터디·이투스·대성마이맥은 공식 목록에서 확인한 강사 ID로 '강사 홈' 페이지에 바로 연결 (가장 확실)
      const P = PLATFORM_LINKS[p];
      const ids = TEACHER_IDS[p] || {};
      const id = ids[t.name + '|' + t.subSubject] || ids[t.name];
      if (P && P.teacher && id) return { url: P.teacher(id), kind: 'teacher' };
      if (info.links && info.links[p]) return { url: info.links[p], kind: 'teacher' };
      const domain = PLATFORM_DOMAINS[p];
      if (info.link && info.link !== 'none' && (!domain || info.link.includes(domain))) return { url: info.link, kind: 'teacher' };
      if (P) return { url: P.subject[t.subSubject] || P.subject[t.subject] || P.home, kind: 'platform' };
      return { url: info.link || 'https://www.ebsi.co.kr/', kind: info.link ? 'teacher' : 'platform' };
    }

    function teacherLink(t, info = teacherDetails[t.name] || {}) {
      return linkFor(t, platformOf(t), info);
    }

      const plats = platformsOf(t);
      const btn = (p, i) => {
        const { url, kind } = linkFor(t, p, info);
        const label = kind === 'teacher' ? `${p}에서 강좌 보기` : `${p} 강사 목록 보기`;
        return `<a class="link-btn site-btn${i ? ' alt' : ''}" href="${esc(url)}" target="_blank" rel="noopener">${esc(label)}</a>`;
      };
      if (plats.length > 1) {
        return `
        <div class="modal-section site-choice">
          <h4>어느 사이트에서 볼까요?</h4>
          <p class="link-note" style="margin:0 0 10px;text-align:left">${esc(t.name)} 선생님은 ${plats.map(esc).join(' · ')}에서 강의해요. 원하는 사이트를 골라 주세요.</p>
          <div class="site-btns">${plats.map(btn).join('')}</div>
        </div>`;
      }
      const { kind } = linkFor(t, plats[0], info);
      return btn(plats[0], 0) +
        `<p class="link-note">${kind === 'teacher' ? '공식 강사 페이지가 새 탭에서 열려요' : '강사 개인 페이지 주소를 아직 몰라서, 공식 강사 목록으로 연결돼요'}</p>`;
    }

    // teacher-courses.js 의 강좌·특징을 합침 (이미 있는 정보가 우선)
    Object.entries(window.EXTRA_DETAILS || {}).forEach(([name, d]) => {
      const cur = teacherDetails[name];
      if (!cur) { teacherDetails[name] = d; return; }
      // 공식 페이지에서 새로 확인한 강좌가 더 많으면 새 목록으로 교체
      if (d.courses && d.courses.length > ((cur.courses && cur.courses.length) || 0)) cur.courses = d.courses;
      if (!(cur.features && cur.features.length) && d.features && d.features.length) cur.features = d.features;
      if (d.links) cur.links = { ...d.links, ...(cur.links || {}) };
    });

    /* ===== 강좌 가격 · 수강 기간 · 교재 가격 =====
       course-prices.js 의 강좌명과 '강좌 리스트'의 강좌명을 비교해서 붙임 */
    const titleKey = s => String(s || '')
      .replace(/\[[^\]]*\]|\([^)]*\)|<[^>]*>|【[^】]*】/g, ' ')   // [2027] (스튜디오) 같은 꾸밈말 제거
      .replace(/new|20\d\d|강좌|수능|대비/gi, ' ')
      .replace(/[^0-9a-zA-Z가-힣ⅠⅡ]/g, '').toLowerCase();

    // 두 강좌명이 얼마나 비슷한지 (0~1): 짧은 쪽 글자가 긴 쪽에 순서대로 얼마나 들어있나
    function titleSimilarity(a, b) {
      a = titleKey(a); b = titleKey(b);
      if (!a || !b) return 0;
      if (a === b) return 1;
      if (a.includes(b) || b.includes(a)) return 0.9;
      const [s, l] = a.length < b.length ? [a, b] : [b, a];
      // 최장 공통 부분 문자열 길이
      let best = 0;
      for (let i = 0; i < s.length; i++)
        for (let j = i + best + 1; j <= s.length; j++)
          if (l.includes(s.slice(i, j))) best = j - i; else break;
      return best / s.length;
    }

    function withPrices(t, courses) {
      const isEBSOnly = t.platform.split('/').every(p => p.trim() === 'EBS');
      const list = (window.COURSE_PRICES && window.COURSE_PRICES[t.name]) || [];
      const used = new Set();
      const out = courses.map(c => {
        if (c.p || c.d || c.b) return { ...c };   // 관리자가 직접 넣은 가격·기간·교재는 그대로
        let bi = -1, bs = 0;
        list.forEach((e, i) => {
          if (used.has(i)) return;
          const sc = titleSimilarity(c.title, e.t);
          if (sc > bs) { bs = sc; bi = i; }
        });
        if (bi >= 0 && bs >= 0.6) {
          used.add(bi);
          const e = list[bi];
          return { ...c, p: e.p, d: e.d, b: e.b };
        }
        // EBS 강의는 무료
        if (isEBSOnly) return { ...c, p: '무료', d: '제한 없음', b: c.book === false ? '교재 없음 (강의자료 제공)' : 'EBS 교재 별도 구매' };
        return { ...c };
      });
      // 가격표에는 있지만 강좌 리스트에 없던 강좌도 함께 보여줌
      list.forEach((e, i) => { if (!used.has(i)) out.push({ title: e.t, desc: '', p: e.p, d: e.d, b: e.b, extra: true }); });
      return out;
    }

    function priceTagsHTML(c) {
      const tags = [];
      if (c.p) tags.push(`<span class="ptag price"><em>가격</em>${esc(c.p)}</span>`);
      if (c.d) tags.push(`<span class="ptag days"><em>수강 기간</em>${esc(c.d)}</span>`);
      if (c.b) tags.push(`<span class="ptag book"><em>교재</em>${esc(c.b)}</span>`);
      return tags.length ? `<div class="ptags">${tags.join('')}</div>` : '';
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function openDetail(t) {
      const info = teacherDetails[t.name] || {};
      const features = (info.features && info.features.length) ? info.features : [t.desc];
      // 관리자가 강좌를 직접 입력했으면 그 목록만 보여줌 (사이트에서 모은 예전 목록은 숨김)
      const courses = info.adminCourses ? info.courses.map(c => ({ ...c })) : withPrices(t, info.courses || []);

      const subj = labelMap.subject[t.subject] + (t.subSubject ? ' · ' + labelMap.subSubject[t.subSubject] : '');
      document.getElementById('detail-body').innerHTML = `
        <button class="modal-close" onclick="closeDetail()" aria-label="닫기">✕</button>
        <h3>${esc(t.name)}</h3>
        <div class="teacher-platform">📌 ${esc(t.platform)} · ${esc(subj)}</div>
        <div class="teacher-tags" style="margin-top:8px">${teacherTags(t).map(x => `<span class="tag">${x}</span>`).join('')}</div>
        ${t.adminEdited && t.desc && !features.includes(t.desc) ? `<p class="course-desc" style="margin-top:10px">${esc(t.desc)}</p>` : ''}

        <div class="modal-section">
          <h4>✨ 강사 특징</h4>
          <ul class="feature-list">${features.map(f => `<li>${esc(f)}</li>`).join('')}</ul>
        </div>

        <div class="modal-section">
          <h4>📚 강좌 리스트</h4>
          ${courses.length
            ? `<div class="course-list">${courses.map((c, i) => (c.extra && !(courses[i - 1] || {}).extra ? `<div class="course-sub">사이트에서 확인한 강좌 · 가격</div>` : '') + `
                <div class="course-item">
                  <div class="course-title">${esc(c.title)}</div>
                  ${c.desc ? `<div class="course-desc">${esc(c.desc)}</div>` : ''}
                  ${priceTagsHTML(c)}
                </div>`).join('')}</div>
              <p class="price-note">${courses.some(c => c.p || c.d || c.b) ? '가격·수강 기간·교재 가격은 2026년 11월 9일 각 사이트 기준이에요. 할인·패스·이벤트에 따라 달라질 수 있으니 결제 전 사이트에서 꼭 확인하세요.' : '가격·수강 기간은 아래 사이트에서 확인해 주세요.'}</p>`
            : '<p class="empty-note">강좌 정보를 준비 중이에요. 아래 링크에서 최신 강좌를 확인해 주세요.</p>'}
        </div>

        ${linkButtonsHTML(t, info)}
        ${typeof isAdminUser === 'function' && isAdminUser() ? `<button class="ghost-btn" style="margin-top:12px" onclick='openTeacherEditor(${jsArgSafe(JSON.stringify({ name: t.name, subject: t.subject, subSubject: t.subSubject }))})'>관리자: 이 선생님 정보 수정</button>` : ''}`;
      document.getElementById('detail-modal').classList.add('open');
      document.getElementById('detail-body').scrollTop = 0;
    }

    function closeDetail() {
      document.getElementById('detail-modal').classList.remove('open');
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });

    /* ===== 추천 결과 저장 (이 브라우저에 보관) ===== */
    const SAVE_KEY = 'insegnante.savedResults';
    let lastResult = null;

    function loadSaved() {
      try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || []; } catch (e) { return []; }
    }
    function storeSaved(list) {
      try { localStorage.setItem(SAVE_KEY, JSON.stringify(list)); return true; } catch (e) { return false; }
    }

    function resetSaveButton() {
      const b = document.getElementById('save-result-btn');
      if (b) { b.textContent = '결과 저장'; b.disabled = false; b.classList.remove('done'); }
    }

    function saveResult() {
      if (!lastResult) return;
      const now = new Date();
      const item = { id: now.getTime(), savedAt: now.toISOString(), ...lastResult };
      const list = [item, ...loadSaved()].slice(0, 30);   // 최근 30개까지 보관
      const b = document.getElementById('save-result-btn');
      if (!storeSaved(list)) { alert('이 브라우저에서는 저장할 수 없어요. (개인정보 보호 모드인지 확인해 주세요)'); return; }
      b.textContent = '저장됨 ✓';
      b.disabled = true;
      b.classList.add('done');
    }

    function fmtSavedDate(iso) {
      const d = new Date(iso);
      const p = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}.${p(d.getMonth() + 1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    }

    function subjectOf(ans) {
      const s = labelMap.subject[ans.subject] || '';
      return ans.subSubject ? `${s} · ${labelMap.subSubject[ans.subSubject] || ''}` : s;
    }

    function savedModal(html) {
      const body = document.getElementById('detail-body');
      body.innerHTML = `<button class="modal-close" onclick="closeDetail()" aria-label="닫기">✕</button>` + html;
      document.getElementById('detail-modal').classList.add('open');
      body.scrollTop = 0;
    }

    // 저장한 결과 목록
    function openSavedResults() {
      if (typeof toggleSearch === 'function') toggleSearch(false);
      const list = loadSaved();
      savedModal(`
        <h3>저장한 추천 결과</h3>
        <p class="link-note" style="text-align:left;margin:4px 0 14px">이 브라우저에 저장된 결과예요. 최근 30개까지 보관돼요.</p>
        ${list.length ? list.map(r => `
          <div class="saved-item">
            <div class="saved-main" onclick="viewSavedResult(${r.id})">
              <div class="saved-date">${fmtSavedDate(r.savedAt)}</div>
              <div class="saved-subj">${esc(subjectOf(r.answers))}</div>
              <div class="saved-top">${r.top.slice(0, 3).map((t, i) => `${i + 1}. ${esc(t.name)}`).join('  ')}</div>
            </div>
            <div class="my-actions">
              <button class="mini-btn accent" onclick="viewSavedResult(${r.id})">보기</button>
              <button class="mini-btn" onclick="deleteSavedResult(${r.id})">삭제</button>
            </div>
          </div>`).join('')
          : '<p class="empty-note">아직 저장한 결과가 없어요. 설문을 마친 뒤 결과 화면에서 <b>결과 저장</b>을 눌러 주세요.</p>'}`);
    }

    // 저장한 결과 하나 자세히 보기
    function viewSavedResult(id) {
      const r = loadSaved().find(x => x.id === id);
      if (!r) return openSavedResults();
      const rows = Object.keys(questionLabel).filter(k => r.answers[k]).map(k =>
        `<div class="summary-row"><span class="summary-label">${esc(questionLabel[k])}</span><span class="summary-value">${esc((labelMap[k] && labelMap[k][r.answers[k]]) || r.answers[k])}</span></div>`).join('');
      savedModal(`
        <h3>${esc(subjectOf(r.answers))} 추천 결과</h3>
        <div class="teacher-platform">${fmtSavedDate(r.savedAt)} 저장</div>
        <div class="modal-section">
          <h4>추천 선생님</h4>
          ${r.top.map((t, i) => {
            const exists = !!findTeacher(t.name);
            return `<div class="saved-teacher">
              <span class="saved-rank">${i + 1}</span>
              <div class="saved-tmain"><b>${esc(t.name)}</b> <span class="muted small">${esc(t.platform)}</span>
                <div class="muted small">적합도 ${t.pct}%</div></div>
              ${exists ? `<button class="mini-btn" onclick="openDetail(findTeacher(${jsArgSafe(t.name)}))">자세히</button>` : '<span class="muted small">현재 목록에 없음</span>'}
            </div>`;
          }).join('')}
        </div>
        <div class="modal-section">
          <h4>내 답변</h4>
          <div class="summary-panel open" style="display:block">${rows}</div>
        </div>
        <div class="site-btns" style="margin-top:18px">
          <button class="link-btn as-btn" onclick="rerunSaved(${r.id})">이 조건으로 다시 추천받기</button>
          <button class="link-btn as-btn alt" onclick="openSavedResults()">목록으로</button>
        </div>
        <p class="link-note">선생님 정보가 바뀌었을 수 있어서, 다시 추천받으면 결과가 달라질 수 있어요.</p>`);
    }

    function jsArgSafe(s) { return esc(JSON.stringify(String(s))); }

    function deleteSavedResult(id) {
      if (!confirm('이 결과를 삭제할까요?')) return;
      storeSaved(loadSaved().filter(x => x.id !== id));
      openSavedResults();
    }

    // 저장된 답변으로 다시 추천 계산
    function rerunSaved(id) {
      const r = loadSaved().find(x => x.id === id);
      if (!r) return;
      closeDetail();
      answers = { ...r.answers };
      buildActiveQuestions();
      const cur = document.querySelector('.screen.active');
      if (cur && cur.id !== 'loading-screen') {
        // computeAndShowResult 는 loading-screen → result-screen 으로 전환하므로 먼저 맞춰 둠
        cur.classList.remove('active'); cur.style.display = 'none';
        const ld = document.getElementById('loading-screen');
        ld.classList.add('active'); ld.style.display = 'flex';
      }
      computeAndShowResult();
    }

    // PDF로 저장 / 인쇄 (브라우저 인쇄 창에서 'PDF로 저장' 선택)
    function printResult() {
      const p = document.getElementById('summary-panel');
      const wasOpen = p.classList.contains('open');
      p.classList.add('open');
      document.body.classList.add('printing-result');
      setTimeout(() => {
        window.print();
        document.body.classList.remove('printing-result');
        if (!wasOpen) p.classList.remove('open');
      }, 50);
    }

    function toggleSummary() {
      const p = document.getElementById('summary-panel');
      const a = document.getElementById('summary-arrow');
      p.classList.toggle('open');
      a.textContent = p.classList.contains('open') ? '▲' : '▼';
    }

    function restart(from) {
      currentIndex = 0; answers = {};
      switchScreen(from || 'result-screen', 'start-screen');
    }
  </script>
